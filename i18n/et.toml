home_about_label = "Konsortsium"
home_about_title = "Meist"
home_about_p1 = "Consorzio Logistico Latina Scalo ühendab viit kohalikku ettevõtet, kelle koondkogemus kaupade ladustamises, käitlemises ja veos ületab viiskümmend aastat."
home_about_p2 = "Keskus asub Latina Scalo tööstuspiirkonnas, 8 km kaugusel Latina kesklinnast, 15 km kaugusel Cisterna di Latinast ja 34 km kaugusel Apriliast. Latina raudteejaam Rooma–Formia–Napoli liinil asub Latina Scalos; maanteed SS148 Pontina ja SS7 Appia ühendavad objekti Rooma ja Pontina lõunaosaga."
home_about_p3 = "Konsortsium töötab lepingulise logistika alusel: riiulitel ja põrandal ladustamine, tellimuste komplekteerimine, maanteevedu oma autopargiga ja dokumendihaldus, tellijale üks kontaktisik."
home_services_label = "Teenused"
home_services_title = "Konsortsiumi tegevus"
home_services_intro = "Lepingulise logistika teenused tootmis-, kaubandus- ja jaotusettevõtetele."
svc_storage_title = "Ladustamine ja ladu"
svc_storage_text = "Moodulhooned pindalaga 500 kuni 3 000 ruutmeetrit, kasulik kõrgus kuni 10 meetrit, kaubaalusteriiulid, temperatuurikontrolliga alad ja WMS-süsteemis hallatav inventuur."
svc_transport_title = "Vedu ja jaotus"
svc_transport_text = "Maanteevedu oma autopargiga, B2B-tarned üle Itaalia ja viimase miili jaotus Lazios."
svc_handling_title = "Kaubakäitlus"
svc_handling_text = "Vastuvõtt, komplekteerimine, pakendamine, märgistamine, kaubaalustele laadimine ja ristlaadimine koos sissetuleva kauba koguse ja kvaliteedi kontrolliga."
svc_3pl_title = "3PL-logistika"
svc_3pl_text = "Ladustamine, kaubakäitlus ja vedu ühe teenusepakkuja käes, muutuvkuludega, mis sõltuvad tegelikest mahtudest."
svc_docs_title = "Dokumendihaldus"
svc_docs_text = "Veodokumendid, DDT (Itaalia saateleht) ja saatelehed, kaupade jälgitavus ja liidestus tellija majandustarkvaraga."
svc_yards_title = "Välilaoplatsid"
svc_yards_text = "25 000 ruutmeetrit välipinda ehitusmaterjalide, mahukate kaupade ja sõidukite jaoks."
home_site_label = "Objekt"
home_site_title = "Via della Dinamica keskus"
home_site_intro = "Latina Scalo tööstuspiirkonnas asuva logistikaobjekti varustus."
fac_buildings_title = "Laohooned"
fac_buildings_text = "Moodulehitised, igaüks 500 kuni 3 000 ruutmeetrit, kasulik kõrgus kuni 10 meetrit, ette valmistatud kaubaalusteriiulite ja käitlussüsteemide jaoks."
fac_yards_title = "Platsid ja laadimisrambid"
fac_yards_text = "Platsid poolhaagisautode manööverdamiseks, kaetud laadimis- ja mahalaadimisrambid ning sõidukite parkimisalad."
fac_security_title = "Turvalisus"
fac_security_text = "Perimeetri videovalve, läbipääsukontroll, tulekustutus- ja valvesüsteemid; töö ööpäevaringselt."
