stat_eur = "km drogą od dzielnicy EUR"
home_about_label = "Konsorcjum"
home_about_title = "O nas"
home_about_p1 = "Consorzio Logistico Latina Scalo zrzesza pięć lokalnych firm, które łącznie mają ponad pięćdziesiąt lat doświadczenia w magazynowaniu, obsłudze i transporcie towarów."
home_about_p2 = "Centrum znajduje się w strefie przemysłowej Latina Scalo, 8 km od centrum Latiny, 15 km od Cisterna di Latina i 34 km od Aprilii. Stacja Latina na linii Rzym–Formia–Neapol leży w Latina Scalo; drogi SS148 Pontina i SS7 Appia łączą obiekt z Rzymem i z południową częścią regionu pontyjskiego."
home_about_p3 = "Konsorcjum działa na zlecenie klientów: składowanie regałowe i blokowe, kompletacja zamówień, transport drogowy własną flotą oraz obsługa dokumentacji, z jednym punktem kontaktu dla zleceniodawcy."
home_services_label = "Usługi"
home_services_title = "Zakres działalności Konsorcjum"
home_services_intro = "Usługi logistyki kontraktowej dla firm produkcyjnych, handlowych i dystrybucyjnych."
svc_storage_title = "Składowanie i magazyn"
svc_storage_text = "Modułowe hale o powierzchni od 500 do 3000 metrów kwadratowych, wysokość użytkowa do 10 metrów, regały paletowe, strefy o kontrolowanej temperaturze i inwentaryzacja prowadzona w systemie WMS."
svc_transport_title = "Transport i dystrybucja"
svc_transport_text = "Transport drogowy własną flotą, dostawy B2B na terenie całych Włoch oraz dystrybucja ostatniej mili w regionie Lacjum."
svc_handling_title = "Obsługa magazynowa"
svc_handling_text = "Przyjęcie towaru, picking, pakowanie, etykietowanie, paletyzacja i cross-docking, z kontrolą ilościową i jakościową przy przyjęciu."
svc_3pl_title = "Logistyka 3PL"
svc_3pl_text = "Składowanie, obsługa magazynowa i transport powierzone jednemu operatorowi, z kosztami zmiennymi zależnymi od rzeczywistych wolumenów."
svc_docs_title = "Obsługa dokumentacji"
svc_docs_text = "Dokumenty przewozowe, DDT (włoski dokument dostawy) i listy przewozowe, identyfikowalność towarów oraz integracja z systemami zarządczymi zleceniodawcy."
svc_yards_title = "Place otwarte"
svc_yards_text = "25 000 metrów kwadratowych placów otwartych na materiały budowlane, towary wielkogabarytowe i pojazdy."
home_site_label = "Obiekt"
home_site_title = "Centrum przy Via della Dinamica"
home_site_intro = "Wyposażenie obiektu logistycznego w strefie przemysłowej Latina Scalo."
fac_buildings_title = "Hale"
fac_buildings_text = "Konstrukcje modułowe o powierzchni od 500 do 3000 metrów kwadratowych każda, wysokość użytkowa do 10 metrów, przystosowane do regałów paletowych i systemów transportu wewnętrznego."
fac_yards_title = "Place i rampy"
fac_yards_text = "Place manewrowe dla ciągników siodłowych z naczepami, zadaszone rampy załadunkowe i rozładunkowe oraz miejsca postojowe dla pojazdów."
fac_security_title = "Bezpieczeństwo"
fac_security_text = "Monitoring wizyjny obwodu, kontrola dostępu, instalacje przeciwpożarowe i antywłamaniowe; praca całodobowa."
fac_it_title = "Systemy informatyczne"
fac_it_text = "Dedykowane łącze światłowodowe, przemysłowe Wi-Fi i system WMS do zarządzania magazynem."
fac_offices_title = "Biura"
fac_offices_text = "Biura, sale konferencyjne i pomieszczenie socjalne dla personelu operacyjnego."
home_sectors_label = "Branże"
home_sectors_title = "Obsługiwane branże"
home_sectors_intro = "Rolno-spożywcza, farmaceutyczna, motoryzacyjna, e-commerce, budowlana, tekstylna i modowa, handel wielkopowierzchniowy oraz przemysł wytwórczy."
home_areas_label = "Obszar działania"
home_areas_title = "Obsługiwane obszary"
home_areas_intro = "Odległości drogowe od obiektu przy Via della Dinamica, obliczone na podstawie sieci OpenStreetMap. Każda gmina i dzielnica ma osobną stronę z trasą, czasem przejazdu i usługami."
