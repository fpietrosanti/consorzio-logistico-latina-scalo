home_title = "Consorzio Logistico Latina Scalo: imħażen u loġistika għal terzi bejn Latina u Ruma t'Isfel"
home_description = "Pol loġistiku f'Latina Scalo (LT): 19,000 m² koperti u 25,000 m² miftuħa. Ħżin, handling, trasport u loġistika 3PL għall-intrapriżi ta' Latina u Ruma t'Isfel."
home_hero_title = "Imħażen u loġistika għal terzi f'Latina Scalo"
home_hero_sub = "Il-Consorzio Logistico Latina Scalo jopera f'Via della Dinamica, fiż-żona ta' Tor Tre Ponti, pol b'19,000 metru kwadru koperti u 25,000 metru kwadru ta' żoni miftuħa. Jaqdi l-intrapriżi tal-provinċja ta' Latina, tal-komuni fin-nofsinhar ta' Ruma u tal-kwadrant tan-nofsinhar tal-belt kapitali."
