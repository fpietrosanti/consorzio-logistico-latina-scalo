home_about_label = "Konsortiet"
home_about_title = "Om os"
home_about_p1 = "Consorzio Logistico Latina Scalo samler fem lokale virksomheder med over halvtreds års samlet erfaring inden for lagring, varehåndtering og godstransport."
home_about_p2 = "Logistikcentret ligger i industriområdet Latina Scalo, 8 km fra Latinas centrum, 15 km fra Cisterna di Latina og 34 km fra Aprilia. Latina station på strækningen Rom–Formia–Napoli ligger i Latina Scalo; SS148 Pontina og SS7 Appia forbinder anlægget med Rom og det sydlige Pontino-område."
home_about_p3 = "Konsortiet arbejder for tredjepart: lagring på reoler og på gulv, ordreplukning, vejtransport med egen vognpark og dokumenthåndtering, med én kontaktperson for kunden."
home_services_label = "Ydelser"
home_services_title = "Konsortiets ydelser"
