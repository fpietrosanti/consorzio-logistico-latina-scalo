home_title = "Consorzio Logistico Latina Scalo: lager och tredjepartslogistik mellan Latina och södra Rom"
home_description = "Logistikanläggning i Latina Scalo (LT): 19 000 m² under tak och 25 000 m² utomhus. Lagring, hantering, transport och 3PL för företag i Latina och södra Rom."
home_hero_title = "Lager och tredjepartslogistik i Latina Scalo"
home_hero_sub = "Consorzio Logistico Latina Scalo driver på Via della Dinamica, i området Tor Tre Ponti, en anläggning med 19 000 kvadratmeter under tak och 25 000 kvadratmeter utomhusytor. Anläggningen betjänar företag i provinsen Latina, i kommunerna söder om Rom och i Roms södra stadsdelar."
