home_about_label = "Konsortio"
home_about_title = "Tietoa konsortiosta"
home_about_p1 = "Consorzio Logistico Latina Scalo kokoaa yhteen viisi alueen yritystä, joilla on yhteensä yli viidenkymmenen vuoden kokemus varastoinnista, tavaran käsittelystä ja kuljetuksesta."
home_about_p2 = "Logistiikkakeskus sijaitsee Latina Scalon teollisuusalueella, 8 km:n päässä Latinan keskustasta, 15 km:n päässä Cisterna di Latinasta ja 34 km:n päässä Apriliasta. Latinan rautatieasema Rooma–Formia–Napoli-radalla sijaitsee Latina Scalossa; SS148 Pontina ja SS7 Appia yhdistävät toimipaikan Roomaan ja eteläiseen Pontinan alueeseen."
home_about_p3 = "Konsortio toimii kolmannen osapuolen logistiikkapalvelujen tarjoajana: hylly- ja lattiavarastointi, keräily, maantiekuljetukset omalla kalustolla sekä asiakirjahallinta, ja toimeksiantajalla on yksi yhteyshenkilö."
home_services_label = "Palvelut"
home_services_title = "Konsortion palvelut"
home_services_intro = "Kolmannen osapuolen logistiikkapalvelut valmistavan teollisuuden, kaupan ja jakelun yrityksille."
svc_storage_title = "Varastointi ja varasto"
svc_storage_text = "Modulaariset hallit 500–3 000 neliömetriä, hyötykorkeus enintään 10 metriä, lavahyllyt, lämpötilasäädellyt tilat ja WMS-järjestelmällä hallittu varastokirjanpito."
svc_transport_title = "Kuljetus ja jakelu"
svc_transport_text = "Maantiekuljetukset omalla kalustolla, B2B-toimitukset koko Italiaan ja viimeisen kilometrin jakelu Lazion alueella."
svc_handling_title = "Tavaran käsittely"
svc_handling_text = "Vastaanotto, keräily, pakkaus, merkintä, lavaus ja cross-docking sekä saapuvan tavaran laadun ja määrän tarkastus."
svc_3pl_title = "3PL-logistiikka"
svc_3pl_text = "Varastointi, käsittely ja kuljetus yhden palveluntarjoajan hoidossa; muuttuvat kustannukset määräytyvät todellisten volyymien mukaan."
svc_docs_title = "Asiakirjahallinta"
svc_docs_text = "Kuljetusasiakirjat, DDT-rahtikirjat ja lähetteet, tavaran jäljitettävyys sekä integrointi toimeksiantajan toiminnanohjausjärjestelmiin."
svc_yards_title = "Ulkoalueet"
svc_yards_text = "25 000 neliömetriä ulkoalueita rakennusmateriaaleille, tilaa vievälle tavaralle ja ajoneuvoille."
home_site_label = "Toimipaikka"
home_site_title = "Via della Dinamican logistiikkakeskus"
home_site_intro = "Latina Scalon teollisuusalueella sijaitsevan logistiikkakeskuksen varustus."
fac_buildings_title = "Hallit"
fac_buildings_text = "Modulaariset rakennukset, kukin 500–3 000 neliömetriä, hyötykorkeus enintään 10 metriä, valmiudet lavahyllyille ja käsittelyjärjestelmille."
fac_yards_title = "Piha-alueet ja lastauslaiturit"
fac_yards_text = "Piha-alueet ajoneuvoyhdistelmien kääntymiseen, katetut lastaus- ja purkulaiturit sekä ajoneuvojen pysäköintialueet."
fac_security_title = "Turvallisuus"
fac_security_text = "Kehävideovalvonta, kulunvalvonta, palo- ja murtohälytysjärjestelmät; toiminta ympäri vuorokauden."
fac_it_title = "Tietojärjestelmät"
fac_it_text = "Oma valokuituyhteys, teollisuus-Wi-Fi ja WMS-järjestelmä varastonhallintaan."
fac_offices_title = "Toimistot"
fac_offices_text = "Toimistot, kokoustilat ja taukotila operatiiviselle henkilöstölle."
home_sectors_label = "Toimialat"
