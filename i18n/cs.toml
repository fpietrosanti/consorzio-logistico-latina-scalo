home_about_label = "Konsorcium"
home_about_title = "O nás"
home_about_p1 = "Consorzio Logistico Latina Scalo sdružuje pět místních firem s celkovou praxí přes padesát let ve skladování, manipulaci se zbožím a přepravě."
home_about_p2 = "Areál se nachází v průmyslové zóně Latina Scalo, 8 km od centra Latiny, 15 km od Cisterna di Latina a 34 km od Aprilie. Nádraží Latina na trati Řím–Formia–Neapol leží přímo v Latina Scalo; silnice SS148 Pontina a SS7 Appia spojují areál s Římem a s jihem provincie."
home_about_p3 = "Konsorcium pracuje pro třetí strany: regálové a blokové skladování, kompletace objednávek, silniční přeprava vlastní flotilou a správa dokumentace, s jedinou kontaktní osobou pro zadavatele."
home_services_label = "Služby"
home_services_title = "Co Konsorcium nabízí"
home_services_intro = "Služby smluvní logistiky pro výrobní, obchodní a distribuční firmy."
svc_storage_title = "Skladování a sklad"
svc_storage_text = "Modulární haly od 500 do 3 000 metrů čtverečních, užitná výška až 10 metrů, paletové regály, prostory s řízenou teplotou a evidence zásob v systému WMS."
svc_transport_title = "Přeprava a distribuce"
svc_transport_text = "Silniční přeprava vlastní flotilou, rozvoz B2B po celé Itálii a distribuce na poslední míli v regionu Lazio."
svc_handling_title = "Manipulace se zbožím"
svc_handling_text = "Příjem, vychystávání, balení, etiketování, paletizace a cross-docking, s kvantitativní a kvalitativní kontrolou při příjmu."
svc_3pl_title = "Logistika 3PL"
svc_3pl_text = "Skladování, manipulace a přeprava svěřené jedinému operátorovi, s variabilními náklady odvozenými od skutečných objemů."
svc_docs_title = "Správa dokumentace"
svc_docs_text = "Přepravní doklady, dodací listy DDT, sledovatelnost zboží a propojení s informačními systémy zadavatele."
svc_yards_title = "Venkovní plochy"
svc_yards_text = "25 000 metrů čtverečních venkovních ploch pro stavební materiály, objemné zboží a vozidla."
home_site_label = "Areál"
home_site_title = "Areál ve Via della Dinamica"
home_site_intro = "Vybavení logistického areálu v průmyslové zóně Latina Scalo."
fac_buildings_title = "Haly"
fac_buildings_text = "Modulární objekty o ploše od 500 do 3 000 metrů čtverečních, užitná výška až 10 metrů, připravené pro paletové regály a manipulační systémy."
fac_yards_title = "Manipulační plochy a rampy"
fac_yards_text = "Plochy pro manévrování návěsových souprav, kryté nakládací a vykládací rampy a odstavné plochy pro vozidla."
fac_security_title = "Zabezpečení"
fac_security_text = "Kamerový dohled po obvodu, kontrola vstupu, požární a zabezpečovací systémy; provoz 24 hodin denně."
fac_it_title = "Informační systémy"
fac_it_text = "Vyhrazené optické připojení, průmyslová Wi-Fi a systém WMS pro řízení skladu."
fac_offices_title = "Kanceláře"
fac_offices_text = "Kanceláře, zasedací místnosti a odpočinková místnost pro provozní personál."
home_sectors_label = "Odvětví"
home_sectors_title = "Obsluhovaná odvětví"
home_sectors_intro = "Potravinářství a zemědělství, farmacie, automobilový průmysl, e-commerce, stavebnictví, textil a móda, velkoobchodní a maloobchodní řetězce a výroba."
home_areas_label = "Území"
home_areas_title = "Obsluhované oblasti"
home_areas_intro = "Silniční vzdálenosti od areálu ve Via della Dinamica, vypočtené na silniční síti OpenStreetMap. Každá obec a čtvrť má vlastní stránku s trasou, časy a službami."
