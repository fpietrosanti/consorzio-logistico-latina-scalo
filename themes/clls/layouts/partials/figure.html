{{- /* dict: key, alt, class, eager */ -}}
{{- $k := .key -}}
{{- with and $k (index hugo.Data.images $k) -}}
{{- $i := . -}}
<figure class="photo {{ $.class }}">
  <img src="{{ printf "img/%s-800.webp" $k | relURL }}" srcset="{{ printf "img/%s-800.webp" $k | relURL }} 800w, {{ printf "img/%s.webp" $k | relURL }} 1600w" sizes="(max-width: 900px) 100vw, 900px" alt="{{ $.alt }}" width="1600" height="1000" {{ if not $.eager }}loading="lazy" {{ end }}decoding="async">
  <figcaption>{{ with $.alt }}{{ . }}{{ if hasPrefix $k "topics/" }} ({{ i18n "photo_repertory" }}){{ end }}. {{ end }}{{ i18n "photo" }}: {{ $i.author }}, <a href="{{ $i.license_url | default $i.page }}" rel="license noopener" target="_blank">{{ $i.license }}</a>, <a href="{{ $i.page }}" rel="noopener" target="_blank">{{ i18n "photo_via" }}</a></figcaption>
</figure>
{{- end -}}
