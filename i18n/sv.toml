home_about_label = "Konsortiet"
home_about_title = "Om oss"
home_about_p1 = "Consorzio Logistico Latina Scalo samlar fem lokala företag med över femtio års samlad erfarenhet av lagerhållning, godshantering och godstransport."
home_about_p2 = "Anläggningen ligger i industriområdet i Latina Scalo, 8 km från Latinas centrum, 15 km från Cisterna di Latina och 34 km från Aprilia. Latinas järnvägsstation, på linjen Rom–Formia–Neapel, ligger i Latina Scalo; SS148 Pontina och SS7 Appia förbinder anläggningen med Rom och med södra delen av Agro Pontino."
home_about_p3 = "Konsortiet arbetar för tredje part: lagring i pallställ och på golv, orderplockning, vägtransport med egen fordonsflotta och dokumenthantering, med en enda kontaktpart för uppdragsgivaren."
home_services_label = "Tjänster"
home_services_title = "Vad konsortiet gör"
home_services_intro = "Tredjepartslogistik för tillverkande företag, handelsföretag och distributionsföretag."
svc_storage_title = "Lagring och lager"
svc_storage_text = "Modulära lagerbyggnader på 500 till 3 000 kvadratmeter, fri höjd upp till 10 meter, pallställ, temperaturkontrollerade ytor och lagersaldo som hanteras i ett WMS."
svc_transport_title = "Transport och distribution"
svc_transport_text = "Vägtransport med egen fordonsflotta, B2B-leveranser i hela Italien och distribution på sista milen i Lazio."
svc_handling_title = "Godshantering"
svc_handling_text = "Godsmottagning, plockning, packning, märkning, pallettering och cross-docking, med kvalitets- och kvantitetskontroll vid inleverans."
svc_3pl_title = "3PL-logistik"
svc_3pl_text = "Lagring, godshantering och transport hos en och samma operatör, med rörliga kostnader kopplade till faktiska volymer."
svc_docs_title = "Dokumenthantering"
svc_docs_text = "Transportdokument, följesedlar (DDT), spårbarhet för godset och integration med uppdragsgivarens affärssystem."
svc_yards_title = "Utomhusytor"
svc_yards_text = "25 000 kvadratmeter utomhusytor för byggmaterial, skrymmande gods och fordon."
home_site_label = "Anläggningen"
home_site_title = "Anläggningen på Via della Dinamica"
home_site_intro = "Utrustning vid logistikanläggningen i industriområdet i Latina Scalo."
fac_buildings_title = "Lagerbyggnader"
fac_buildings_text = "Modulära byggnader på 500 till 3 000 kvadratmeter vardera, fri höjd upp till 10 meter, förberedda för pallställ och hanteringssystem."
fac_yards_title = "Uppställningsytor och lastportar"
fac_yards_text = "Ytor för manövrering av semitrailerekipage, överbyggda lastportar för lastning och lossning samt uppställningsplatser för fordon."
fac_security_title = "Säkerhet"
fac_security_text = "Kameraövervakning av området, passerkontroll, brandskydds- och inbrottslarmsystem; drift dygnet runt."
fac_it_title = "IT-system"
fac_it_text = "Dedikerad fiberanslutning, industriellt Wi-Fi och WMS för lagerstyrning."
fac_offices_title = "Kontor"
