svc_transport_title = "Transport en distributie"
svc_transport_text = "Wegtransport met een eigen wagenpark, B2B-leveringen in heel Italië en last-mile-distributie in Lazio."
svc_handling_title = "Goederenbehandeling"
svc_handling_text = "Ontvangst, orderpicking, packing, etikettering, palletiseren en cross-docking, met kwantitatieve en kwalitatieve ingangscontrole."
svc_3pl_title = "3PL-logistiek"
