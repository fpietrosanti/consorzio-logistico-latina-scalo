home_title = "Consorzio Logistico Latina Scalo : entrepôts et logistique pour compte d'autrui entre Latina et le sud de Rome"
home_description = "Plateforme logistique à Latina Scalo (LT) : 19 000 m² couverts, 25 000 m² découverts. Stockage, manutention, transport et logistique 3PL, Latina et sud de Rome."
home_hero_title = "Entrepôts et logistique pour compte d'autrui à Latina Scalo"
home_hero_sub = "Le Consorzio Logistico Latina Scalo exploite, Via della Dinamica, dans le secteur de Tor Tre Ponti, une plateforme de 19 000 mètres carrés couverts et de 25 000 mètres carrés de surfaces découvertes. Elle dessert les entreprises de la province de Latina, des communes situées au sud de Rome et du quadrant sud de la capitale."
