home_about_label = "Konsorcijs"
home_about_title = "Par mums"
home_about_p1 = "Consorzio Logistico Latina Scalo apvieno piecus vietējos uzņēmumus ar vairāk nekā piecdesmit gadu kopējo pieredzi kravu uzglabāšanā, apstrādē un pārvadājumos."
home_about_p2 = "Centrs atrodas Latina Scalo industriālajā zonā, 8 km no Latinas centra, 15 km no Cisterna di Latina un 34 km no Aprilia. Latinas stacija uz līnijas Roma–Formia–Neapole atrodas Latina Scalo; autoceļi SS148 Pontina un SS7 Appia savieno objektu ar Romu un Pontīnas dienvidu daļu."
home_about_p3 = "Konsorcijs strādā trešo pušu vajadzībām: uzglabāšana plauktos un uz grīdas, pasūtījumu komplektēšana, autopārvadājumi ar savu autoparku un dokumentu pārvaldība, ar vienu kontaktpersonu pasūtītājam."
home_services_label = "Pakalpojumi"
home_services_title = "Ko dara Konsorcijs"
home_services_intro = "Trešo pušu loģistikas pakalpojumi ražošanas, tirdzniecības un izplatīšanas uzņēmumiem."
svc_storage_title = "Uzglabāšana un noliktava"
svc_storage_text = "Modulāras noliktavu ēkas no 500 līdz 3000 kvadrātmetriem, lietderīgais augstums līdz 10 metriem, palešu plaukti, zonas ar kontrolētu temperatūru un inventarizācija WMS sistēmā."
svc_transport_title = "Pārvadājumi un izplatīšana"
svc_transport_text = "Autopārvadājumi ar savu autoparku, B2B piegādes visā Itālijā un pēdējās jūdzes piegādes Lacio reģionā."
svc_handling_title = "Kravas apstrāde"
svc_handling_text = "Pieņemšana, komplektēšana, iepakošana, marķēšana, paletizācija un cross-docking ar ienākošās kravas kvalitātes un daudzuma kontroli."
svc_3pl_title = "3PL loģistika"
svc_3pl_text = "Uzglabāšana, kravas apstrāde un pārvadājumi, kas uzticēti vienam operatoram, ar mainīgām izmaksām atbilstoši faktiskajiem apjomiem."
svc_docs_title = "Dokumentu pārvaldība"
svc_docs_text = "Pārvadājumu dokumenti, DDT (pavadzīmes) un piegādes zīmes, kravu izsekojamība un integrācija ar pasūtītāja vadības sistēmām."
svc_yards_title = "Atklātie laukumi"
svc_yards_text = "25 000 kvadrātmetru atklātu platību būvmateriāliem, lielgabarīta kravām un transportlīdzekļiem."
home_site_label = "Objekts"
home_site_title = "Centrs Via della Dinamica"
home_site_intro = "Loģistikas objekta aprīkojums Latina Scalo industriālajā zonā."
fac_buildings_title = "Noliktavu ēkas"
fac_buildings_text = "Modulāras konstrukcijas no 500 līdz 3000 kvadrātmetriem katra, lietderīgais augstums līdz 10 metriem, sagatavotas palešu plauktiem un kravas apstrādes sistēmām."
fac_yards_title = "Laukumi un rampas"
fac_yards_text = "Laukumi vilcēju ar puspiekabēm manevrēšanai, segtas iekraušanas un izkraušanas rampas un transportlīdzekļu stāvvietas."
fac_security_title = "Drošība"
fac_security_text = "Perimetra videonovērošana, piekļuves kontrole, ugunsdzēsības un apsardzes signalizācijas sistēmas; darbība 24 stundas diennaktī."
fac_it_title = "Informācijas sistēmas"
fac_it_text = "Atsevišķs optiskās šķiedras pieslēgums, industriālais Wi-Fi un WMS sistēma noliktavas pārvaldībai."
fac_offices_title = "Biroji"
fac_offices_text = "Biroji, sanāksmju telpas un atpūtas zona operatīvajam personālam."
home_sectors_label = "Nozares"
home_sectors_title = "Apkalpotās nozares"
home_sectors_intro = "Lauksaimniecības un pārtikas nozare, farmācija, autobūve, e-komercija, būvniecība, tekstils un mode, lielā mazumtirdzniecība un ražošana."
home_areas_label = "Teritorija"
home_areas_title = "Apkalpotās teritorijas"
home_areas_intro = "Attālumi pa autoceļiem no objekta Via della Dinamica, aprēķināti OpenStreetMap ceļu tīklā. Katrai pašvaldībai un rajonam ir lapa ar maršrutu, laiku un pakalpojumiem."
