home_about_label = "The Consortium"
home_about_title = "About us"
home_about_p1 = "Consorzio Logistico Latina Scalo brings together five local companies with more than fifty years of combined experience in warehousing, handling and freight transport."
home_about_p2 = "The site is in the Latina Scalo industrial area, 8 km from Latina town centre, 15 km from Cisterna di Latina and 34 km from Aprilia. Latina railway station, on the Rome–Formia–Naples line, is in Latina Scalo; the SS148 Pontina and SS7 Appia roads connect the site with Rome and the southern Pontine area."
home_about_p3 = "The Consortium works on a third-party basis: racked and floor storage, order picking, road transport with a dedicated fleet and document management, with a single point of contact for the client."
home_services_label = "Services"
home_services_title = "What the Consortium does"
home_services_intro = "Third-party logistics services for manufacturing, trading and distribution companies."
svc_storage_title = "Storage and warehousing"
svc_storage_text = "Modular buildings of 500 to 3,000 square metres, clear height up to 10 metres, pallet racking, temperature-controlled areas and inventory managed through a WMS."
svc_transport_title = "Transport and distribution"
svc_transport_text = "Road transport with a dedicated fleet, B2B deliveries across Italy and last-mile distribution in Lazio."
svc_handling_title = "Goods handling"
svc_handling_text = "Goods receipt, picking, packing, labelling, palletising and cross-docking, with quantity and quality checks on arrival."
svc_3pl_title = "3PL logistics"
svc_3pl_text = "Storage, handling and transport entrusted to a single operator, with variable costs linked to actual volumes."
svc_docs_title = "Document management"
svc_docs_text = "Transport documents, DDT (Italian delivery notes) and consignment notes, goods traceability and integration with the client's management systems."
svc_yards_title = "Open yards"
svc_yards_text = "25,000 square metres of open space for building materials, bulky goods and vehicles."
home_site_label = "The site"
home_site_title = "The Via della Dinamica site"
home_site_intro = "Facilities of the logistics site in the Latina Scalo industrial area."
