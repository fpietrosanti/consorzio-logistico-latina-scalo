home_about_label = "Konzorcij"
home_about_title = "O nas"
home_about_p1 = "Consorzio Logistico Latina Scalo združuje pet lokalnih podjetij z več kot petdesetimi leti skupnih izkušenj na področju skladiščenja, manipulacije in prevoza blaga."
home_about_p2 = "Središče je v industrijski coni Latina Scalo, 8 km od središča mesta Latina, 15 km od kraja Cisterna di Latina in 34 km od kraja Aprilia. Železniška postaja Latina na progi Rim–Formia–Neapelj je v kraju Latina Scalo; cesti SS148 Pontina in SS7 Appia povezujeta lokacijo z Rimom in z južnim delom pokrajine."
home_about_p3 = "Konzorcij dela za tretje osebe: skladiščenje na regalih in talno skladiščenje, priprava naročil, cestni prevoz z lastnim voznim parkom in upravljanje dokumentacije, z eno samo kontaktno osebo za naročnika."
home_services_label = "Storitve"
home_services_title = "Kaj dela Konzorcij"
home_services_intro = "Storitve pogodbene logistike za proizvodna, trgovska in distribucijska podjetja."
svc_storage_title = "Skladiščenje in skladišče"
svc_storage_text = "Modularne hale od 500 do 3.000 kvadratnih metrov, uporabna višina do 10 metrov, paletni regali, območja z nadzorovano temperaturo in inventura v sistemu WMS."
svc_transport_title = "Prevoz in distribucija"
svc_transport_text = "Cestni prevoz z lastnim voznim parkom, dostave B2B po vsej Italiji in distribucija na zadnjem kilometru v regiji Lacij."
svc_handling_title = "Manipulacija blaga"
svc_handling_text = "Prevzem, komisioniranje, pakiranje, etiketiranje, paletiziranje in cross-docking, s kakovostnim in količinskim prevzemnim pregledom."
svc_3pl_title = "Logistika 3PL"
svc_3pl_text = "Skladiščenje, manipulacija in prevoz pri enem samem izvajalcu, s spremenljivimi stroški, vezanimi na dejanske količine."
svc_docs_title = "Upravljanje dokumentacije"
svc_docs_text = "Prevozni dokumenti, dobavnice DDT, sledljivost blaga in integracija z informacijskimi sistemi naročnika."
svc_yards_title = "Odprte površine"
svc_yards_text = "25.000 kvadratnih metrov odprtih površin za gradbeni material, voluminozno blago in vozila."
home_site_label = "Lokacija"
home_site_title = "Središče na ulici Via della Dinamica"
home_site_intro = "Oprema logistične lokacije v industrijski coni Latina Scalo."
fac_buildings_title = "Hale"
fac_buildings_text = "Modularni objekti od 500 do 3.000 kvadratnih metrov, uporabna višina do 10 metrov, pripravljeni za paletne regale in sisteme za manipulacijo."
fac_yards_title = "Dvorišča in rampe"
fac_yards_text = "Dvorišča za manevriranje vlačilcev s polpriklopniki, pokrite nakladalno-razkladalne rampe in parkirne površine za vozila."
fac_security_title = "Varnost"
fac_security_text = "Videonadzor oboda, nadzor dostopa, protipožarni in protivlomni sistemi; obratovanje 24 ur na dan."
