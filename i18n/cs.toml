# --- Úvod ---
home_title = "Consorzio Logistico Latina Scalo: sklady a smluvní logistika mezi Latinou a jihem Říma"
home_description = "Logistický areál v Latina Scalo (LT): 19 000 m² krytých a 25 000 m² venkovních ploch. Skladování, manipulace, přeprava a 3PL pro firmy z Latiny a jihu Říma."
home_hero_title = "Sklady a smluvní logistika v Latina Scalo"
home_hero_sub = "Consorzio Logistico Latina Scalo provozuje ve Via della Dinamica, v zóně Tor Tre Ponti, areál s 19 000 metry čtverečními krytých ploch a 25 000 metry čtverečními venkovních ploch. Obsluhuje firmy z provincie Latina, z obcí jižně od Říma a z jižní části italské metropole."
home_btn_services = "Služby"
home_btn_areas = "Obsluhované oblasti"
