{{- /* ctx: slice of dict q/a */ -}}
{{- with . -}}
<section class="faq" aria-labelledby="faq-h">
  <h2 id="faq-h">{{ i18n "faq_title" }}</h2>
  {{- range . }}
  <details class="faq-item">
    <summary>{{ .q }}</summary>
    <div class="faq-answer">{{ .a | markdownify }}</div>
  </details>
  {{- end }}
</section>
{{- end -}}
