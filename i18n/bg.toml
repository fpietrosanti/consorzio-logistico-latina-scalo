svc_storage_title = "Складиране и склад"
svc_storage_text = "Модулни халета от 500 до 3 000 квадратни метра, полезна височина до 10 метра, палетни стелажи, зони с контролирана температура и инвентар, управляван чрез WMS система."
svc_transport_title = "Транспорт и дистрибуция"
svc_transport_text = "Автомобилен транспорт със собствен автопарк, B2B доставки на територията на Италия и дистрибуция „последна миля“ в Лацио."
svc_handling_title = "Складови операции"
svc_handling_text = "Приемане, пикинг, пакетиране, етикетиране, палетизиране и кросдокинг, с количествен и качествен контрол при приемане."
svc_3pl_title = "Логистика 3PL"
svc_3pl_text = "Складиране, складови операции и транспорт, възложени на един оператор, с променливи разходи според реалните обеми."
svc_docs_title = "Управление на документацията"
svc_docs_text = "Транспортни документи, DDT и товарителници, проследимост на стоките и интеграция със системите за управление на възложителя."
svc_yards_title = "Открити площадки"
svc_yards_text = "25 000 квадратни метра открити площи за строителни материали, обемни товари и превозни средства."
