svc_transport_title = "Transport og distribution"
svc_transport_text = "Vejtransport med egen vognpark, B2B-leveringer i hele Italien og last mile-distribution i Lazio."
svc_handling_title = "Varehåndtering"
svc_handling_text = "Varemodtagelse, plukning, pakning, etikettering, palletering og cross-docking med kvalitets- og mængdekontrol ved modtagelsen."
svc_3pl_title = "3PL-logistik"
svc_3pl_text = "Lagring, varehåndtering og transport hos én operatør, med variable omkostninger knyttet til de faktiske mængder."
