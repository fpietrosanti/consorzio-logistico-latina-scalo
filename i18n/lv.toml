# --- Sākums ---
home_title = "Consorzio Logistico Latina Scalo: noliktavas un trešo pušu loģistika starp Latinu un Romas dienvidiem"
home_description = "Loģistikas centrs Latina Scalo (LT): 19 000 m² slēgtu un 25 000 m² atklātu platību. Uzglabāšana, kravas apstrāde, pārvadājumi un 3PL loģistika."
home_hero_title = "Noliktavas un trešo pušu loģistika Latina Scalo"
home_hero_sub = "Consorzio Logistico Latina Scalo pārvalda centru Via della Dinamica, Tor Tre Ponti rajonā, ar 19 000 kvadrātmetru slēgtām un 25 000 kvadrātmetru atklātām platībām. Konsorcijs apkalpo uzņēmumus Latinas provincē, pašvaldībās uz dienvidiem no Romas un Romas dienvidu daļā."
