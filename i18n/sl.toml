home_title = "Consorzio Logistico Latina Scalo: skladišča in pogodbena logistika med Latino in južnim Rimom"
home_description = "Logistično središče v kraju Latina Scalo (LT): 19.000 m² pokritih in 25.000 m² odprtih površin. Skladiščenje, manipulacija, prevoz in logistika 3PL."
home_hero_title = "Skladišča in pogodbena logistika v kraju Latina Scalo"
home_hero_sub = "Consorzio Logistico Latina Scalo upravlja na ulici Via della Dinamica, v območju Tor Tre Ponti, središče z 19.000 kvadratnimi metri pokritih in 25.000 kvadratnimi metri odprtih površin. Oskrbuje podjetja iz pokrajine Latina, iz občin južno od Rima in iz južnega dela prestolnice."
