home_about_label = "Консорциумът"
home_about_title = "За нас"
home_about_p1 = "Consorzio Logistico Latina Scalo обединява пет местни фирми с над петдесет години общ опит в складирането, складовите операции и превоза на товари."
home_about_p2 = "Центърът се намира в индустриалната зона на Latina Scalo, на 8 км от центъра на Латина, на 15 км от Cisterna di Latina и на 34 км от Aprilia. Гара Латина, на линията Рим–Формия–Неапол, е в Latina Scalo; пътищата SS148 Pontina и SS7 Appia свързват обекта с Рим и с южната част на Агро Понтино."
home_about_p3 = "Консорциумът работи за трети лица: стелажно и подово складиране, комплектоване на поръчки, автомобилен транспорт със собствен автопарк и управление на документацията, с едно лице за контакт за възложителя."
home_services_label = "Услуги"
home_services_title = "С какво се занимава Консорциумът"
