# --- Inicio ---
home_title = "Consorzio Logistico Latina Scalo: almacenes y logística para terceros entre Latina y el sur de Roma"
home_description = "Plataforma logística en Latina Scalo (LT): 19.000 m² cubiertos y 25.000 m² descubiertos. Almacenaje, handling, transporte y logística 3PL para empresas de Latina y el sur de Roma."
home_hero_title = "Almacenes y logística para terceros en Latina Scalo"
home_hero_sub = "El Consorzio Logistico Latina Scalo gestiona en Via della Dinamica, zona de Tor Tre Ponti, una plataforma con 19.000 metros cuadrados cubiertos y 25.000 metros cuadrados de superficie descubierta. Presta servicio a las empresas de la provincia de Latina, de los municipios al sur de Roma y del sector sur de la capital."
