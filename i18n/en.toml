fac_buildings_text = "Modular buildings of 500 to 3,000 square metres each, clear height up to 10 metres, prepared for pallet racking and handling systems."
fac_yards_title = "Yards and bays"
fac_yards_text = "Yards for articulated lorry manoeuvring, covered loading and unloading bays and vehicle parking areas."
fac_security_title = "Security"
fac_security_text = "Perimeter CCTV, access control, fire protection and intruder alarm systems; operations 24 hours a day."
fac_it_title = "IT systems"
fac_it_text = "Dedicated fibre-optic connection, industrial Wi-Fi and a WMS for warehouse management."
fac_offices_title = "Offices"
