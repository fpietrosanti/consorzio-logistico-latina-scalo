home_about_label = "El Consorcio"
home_about_title = "Quiénes somos"
home_about_p1 = "El Consorzio Logistico Latina Scalo agrupa a cinco empresas de la zona, con más de cincuenta años de experiencia conjunta en almacenaje, manipulación y transporte de mercancías."
home_about_p2 = "La plataforma se encuentra en el área industrial de Latina Scalo, a 8 km del centro de Latina, a 15 km de Cisterna di Latina y a 34 km de Aprilia. La estación de Latina, en la línea Roma–Formia–Nápoles, está en Latina Scalo; la SS148 Pontina y la SS7 Appia conectan el emplazamiento con Roma y con el sur de la provincia."
home_about_p3 = "El Consorcio trabaja para terceros: almacenaje en estantería y en suelo, preparación de pedidos, transporte por carretera con flota propia y gestión documental, con un único interlocutor para el cliente."
home_services_label = "Servicios"
home_services_title = "Qué hace el Consorcio"
home_services_intro = "Servicios de logística para terceros para empresas industriales, comerciales y de distribución."
svc_storage_title = "Almacenaje y almacén"
svc_storage_text = "Naves modulares de 500 a 3.000 metros cuadrados, altura útil de hasta 10 metros, estanterías para palés, zonas de temperatura controlada e inventario gestionado con sistema WMS."
svc_transport_title = "Transporte y distribución"
svc_transport_text = "Transporte por carretera con flota propia, entregas B2B en todo el territorio italiano y distribución de última milla en el Lacio."
svc_handling_title = "Manipulación de mercancías"
svc_handling_text = "Recepción, picking, packing, etiquetado, paletizado y cross-docking, con control cuantitativo y cualitativo a la entrada."
svc_3pl_title = "Logística 3PL"
svc_3pl_text = "Almacenaje, manipulación y transporte confiados a un solo operador, con costes variables ligados a los volúmenes reales."
svc_docs_title = "Gestión documental"
svc_docs_text = "Documentos de transporte, DDT (albarán de transporte italiano) y albaranes, trazabilidad de las mercancías e integración con los sistemas de gestión del cliente."
svc_yards_title = "Explanadas descubiertas"
svc_yards_text = "25.000 metros cuadrados de superficie descubierta para materiales de construcción, mercancías voluminosas y vehículos."
home_site_label = "Las instalaciones"
home_site_title = "La plataforma de Via della Dinamica"
home_site_intro = "Dotaciones de las instalaciones logísticas en el área industrial de Latina Scalo."
fac_buildings_title = "Naves"
fac_buildings_text = "Estructuras modulares de 500 a 3.000 metros cuadrados cada una, altura útil de hasta 10 metros, preparadas para estanterías para palés y sistemas de manipulación."
fac_yards_title = "Explanadas y muelles"
fac_yards_text = "Explanadas para la maniobra de vehículos articulados, muelles de carga y descarga cubiertos y zonas de estacionamiento para vehículos."
fac_security_title = "Seguridad"
fac_security_text = "Videovigilancia perimetral, control de accesos, sistemas contra incendios y antiintrusión; operativa las 24 horas."
fac_it_title = "Sistemas de información"
fac_it_text = "Fibra óptica dedicada, wifi industrial y sistema WMS para la gestión del almacén."
fac_offices_title = "Oficinas"
