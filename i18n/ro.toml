home_title = "Consorzio Logistico Latina Scalo: depozite și logistică pentru terți între Latina și sudul Romei"
home_description = "Platformă logistică la Latina Scalo (LT): 19.000 m² acoperiți și 25.000 m² descoperiți. Depozitare, manipulare, transport și logistică 3PL în Latina și sudul Romei."
home_hero_title = "Depozite și logistică pentru terți la Latina Scalo"
home_hero_sub = "Consorzio Logistico Latina Scalo administrează în Via della Dinamica, zona Tor Tre Ponti, o platformă cu 19.000 de metri pătrați acoperiți și 25.000 de metri pătrați de suprafețe descoperite. Deservește companiile din provincia Latina, din comunele de la sud de Roma și din cadranul sudic al Capitalei."
