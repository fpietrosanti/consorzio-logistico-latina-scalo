home_about_label = "Konzorcij"
home_about_title = "O nama"
home_about_p1 = "Consorzio Logistico Latina Scalo okuplja pet lokalnih tvrtki s ukupno više od pedeset godina iskustva u skladištenju, manipulaciji i prijevozu robe."
home_about_p2 = "Središte se nalazi u industrijskoj zoni Latina Scalo, 8 km od središta Latine, 15 km od Cisterne di Latina i 34 km od Aprilije. Željeznička postaja Latina, na pruzi Rim–Formia–Napulj, nalazi se u mjestu Latina Scalo; državne ceste SS148 Pontina i SS7 Appia povezuju lokaciju s Rimom i jugom pokrajine."
home_about_p3 = "Konzorcij radi za treće strane: skladištenje na policama i podno skladištenje, komisioniranje narudžbi, cestovni prijevoz vlastitim voznim parkom i upravljanje dokumentacijom, s jednim sugovornikom za naručitelja."
home_services_label = "Usluge"
home_services_title = "Čime se Konzorcij bavi"
home_services_intro = "Usluge ugovorne logistike za proizvodne, trgovačke i distribucijske tvrtke."
svc_storage_title = "Skladištenje i skladište"
svc_storage_text = "Modularne hale od 500 do 3.000 četvornih metara, korisne visine do 10 metara, paletni regali, prostori s kontroliranom temperaturom i inventar vođen u sustavu WMS."
svc_transport_title = "Prijevoz i distribucija"
svc_transport_text = "Cestovni prijevoz vlastitim voznim parkom, B2B isporuke na području cijele Italije i distribucija zadnje milje u regiji Lazio."
svc_handling_title = "Manipulacija robom"
svc_handling_text = "Zaprimanje, komisioniranje, pakiranje, etiketiranje, paletiziranje i cross-docking, uz kvantitativnu i kvalitativnu kontrolu pri ulazu."
svc_3pl_title = "3PL logistika"
svc_3pl_text = "Skladištenje, manipulacija i prijevoz povjereni jednom operateru, s varijabilnim troškovima vezanima uz stvarne količine."
svc_docs_title = "Upravljanje dokumentacijom"
svc_docs_text = "Prijevozne isprave, DDT (otpremnice) i dostavnice, sljedivost robe i integracija s poslovnim sustavima naručitelja."
svc_yards_title = "Otvorene površine"
svc_yards_text = "25.000 četvornih metara otvorenih površina za građevinski materijal, glomaznu robu i vozila."
home_site_label = "Lokacija"
home_site_title = "Središte u ulici Via della Dinamica"
home_site_intro = "Opremljenost logističke lokacije u industrijskoj zoni Latina Scalo."
fac_buildings_title = "Hale"
fac_buildings_text = "Modularni objekti od 500 do 3.000 četvornih metara, korisne visine do 10 metara, pripremljeni za paletne regale i sustave manipulacije."
fac_yards_title = "Manipulativne površine i rampe"
fac_yards_text = "Površine za manevriranje tegljača s poluprikolicama, natkrivene utovarno-istovarne rampe i parkirališta za vozila."
fac_security_title = "Sigurnost"
fac_security_text = "Videonadzor perimetra, kontrola pristupa, protupožarni i protuprovalni sustavi; rad 24 sata dnevno."
