home_about_label = "A konzorcium"
home_about_title = "Rólunk"
home_about_p1 = "A Consorzio Logistico Latina Scalo öt helyi vállalatot fog össze, amelyek összesen több mint ötvenéves tapasztalattal rendelkeznek a raktározás, az árumozgatás és az áruszállítás területén."
home_about_p2 = "A központ Latina Scalo ipari övezetében található, 8 km-re Latina központjától, 15 km-re Cisterna di Latinától és 34 km-re Apriliától. A Róma–Formia–Nápoly vonalon fekvő Latina vasútállomás Latina Scalóban van; az SS148 Pontina és az SS7 Appia főút köti össze a telephelyet Rómával és a dél-pontinói térséggel."
home_about_p3 = "A konzorcium harmadik fél részére dolgozik: polcos és padlószintű tárolás, komissiózás, közúti szállítás saját flottával és dokumentumkezelés, a megbízó számára egyetlen kapcsolattartóval."
home_services_label = "Szolgáltatások"
home_services_title = "A konzorcium tevékenysége"
home_services_intro = "Szerződéses logisztikai szolgáltatások gyártó, kereskedelmi és disztribúciós vállalatok részére."
svc_storage_title = "Tárolás és raktározás"
svc_storage_text = "500 és 3000 négyzetméter közötti moduláris csarnokok, legfeljebb 10 méteres hasznos belmagasság, raklapállványok, hőmérséklet-szabályozott területek és WMS-rendszerben vezetett készletnyilvántartás."
svc_transport_title = "Szállítás és disztribúció"
svc_transport_text = "Közúti szállítás saját flottával, B2B kiszállítás Olaszország egész területén és last mile disztribúció Lazio régióban."
svc_handling_title = "Árumozgatás"
svc_handling_text = "Áruátvétel, komissiózás, csomagolás, címkézés, raklapozás és cross-docking, beérkezéskori mennyiségi és minőségi ellenőrzéssel."
svc_3pl_title = "3PL logisztika"
svc_3pl_text = "Tárolás, árumozgatás és szállítás egyetlen szolgáltatónál, a ténylegesen kezelt volumenekhez igazodó változó költségekkel."
svc_docs_title = "Dokumentumkezelés"
svc_docs_text = "Szállítási okmányok, DDT (olasz szállítólevél) és fuvarlevelek, az áruk nyomon követése és integráció a megbízó vállalatirányítási rendszereivel."
svc_yards_title = "Nyitott tárolóterületek"
svc_yards_text = "25 000 négyzetméter nyitott terület építőanyagok, terjedelmes áruk és járművek számára."
home_site_label = "A telephely"
home_site_title = "A Via della Dinamica-i központ"
home_site_intro = "A Latina Scalo ipari övezetében működő logisztikai telephely felszereltsége."
fac_buildings_title = "Csarnokok"
fac_buildings_text = "Egyenként 500 és 3000 négyzetméter közötti moduláris épületek, legfeljebb 10 méteres hasznos belmagassággal, raklapállványok és anyagmozgató rendszerek fogadására előkészítve."
fac_yards_title = "Udvarok és rakodók"
fac_yards_text = "Nyerges szerelvények manőverezésére alkalmas udvarok, fedett be- és kirakodó rámpák, valamint járművárakozó területek."
fac_security_title = "Biztonság"
fac_security_text = "Kerületi videómegfigyelés, beléptetés, tűzvédelmi és behatolásjelző rendszerek; napi 24 órás működés."
fac_it_title = "Informatikai rendszerek"
fac_it_text = "Dedikált optikai hálózat, ipari Wi-Fi és WMS raktárirányítási rendszer."
fac_offices_title = "Irodák"
fac_offices_text = "Irodák, tárgyalók és pihenőhelyiség az operatív személyzet számára."
home_sectors_label = "Ágazatok"
home_sectors_title = "Kiszolgált ágazatok"
home_sectors_intro = "Agrár-élelmiszeripar, gyógyszeripar, autóipar, e-kereskedelem, építőipar, textil- és divatipar, nagykereskedelmi lánc-disztribúció és feldolgozóipar."
home_areas_label = "Térség"
home_areas_title = "Kiszolgált területek"
