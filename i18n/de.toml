home_title = "Consorzio Logistico Latina Scalo: Lager und Kontraktlogistik zwischen Latina und dem Süden Roms"
home_description = "Logistikstandort in Latina Scalo (LT): 19.000 m² überdacht, 25.000 m² Freifläche. Lagerung, Handling, Transport und 3PL für Unternehmen in Latina und Südrom."
home_hero_title = "Lager und Kontraktlogistik in Latina Scalo"
home_hero_sub = "Das Consorzio Logistico Latina Scalo betreibt in der Via della Dinamica, Ortsteil Tor Tre Ponti, einen Standort mit 19.000 Quadratmetern überdachter Fläche und 25.000 Quadratmetern Freifläche. Er versorgt Unternehmen in der Provinz Latina, in den Gemeinden südlich von Rom und im Süden der Hauptstadt."
