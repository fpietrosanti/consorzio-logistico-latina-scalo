home_about_p1 = "Consorzio Logistico Latina Scalo 由当地五家企业组成，在货物仓储、装卸搬运和运输领域累计拥有五十余年经验。"
home_about_p2 = "园区位于 Latina Scalo 工业区，距 Latina 市中心 8 公里，距 Cisterna di Latina 15 公里，距 Aprilia 34 公里。Latina 火车站位于 Latina Scalo，处于罗马—Formia—那不勒斯铁路线上；SS148 Pontina 国道和 SS7 Appia 国道将园区与罗马及 Latina 省南部相连。"
home_about_p3 = "联合体提供第三方物流服务：货架及地面仓储、订单拣选、自有车队公路运输及单证管理，委托方只需对接一个联系人。"
