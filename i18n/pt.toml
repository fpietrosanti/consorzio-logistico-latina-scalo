home_about_p1 = "O Consorzio Logistico Latina Scalo reúne cinco empresas da região, com mais de cinquenta anos de experiência acumulada na armazenagem, na movimentação e no transporte de mercadorias."
home_about_p2 = "O polo situa-se na zona industrial de Latina Scalo, a 8 km do centro de Latina, a 15 km de Cisterna di Latina e a 34 km de Aprilia. A estação de Latina, na linha Roma–Formia–Nápoles, fica em Latina Scalo; a SS148 Pontina e a SS7 Appia ligam as instalações a Roma e ao sul da região pontina."
home_about_p3 = "O Consórcio trabalha por conta de terceiros: armazenagem em estantes e no chão, preparação de encomendas, transporte rodoviário com frota dedicada e gestão documental, com um único interlocutor para o cliente."
home_services_label = "Serviços"
home_services_title = "O que faz o Consórcio"
home_services_intro = "Serviços de logística por conta de terceiros para empresas industriais, comerciais e da distribuição."
svc_storage_title = "Armazenagem e armazém"
svc_storage_text = "Pavilhões modulares de 500 a 3000 metros quadrados, altura útil até 10 metros, estantes porta-paletes, áreas de temperatura controlada e inventário gerido em sistema WMS."
svc_transport_title = "Transporte e distribuição"
svc_transport_text = "Transporte rodoviário com frota dedicada, entregas B2B em território nacional italiano e distribuição de última milha no Lácio."
svc_handling_title = "Movimentação de mercadorias"
svc_handling_text = "Receção, picking, packing, etiquetagem, paletização e cross-docking, com controlo qualitativo e quantitativo à entrada."
svc_3pl_title = "Logística 3PL"
svc_3pl_text = "Armazenagem, movimentação e transporte confiados a um único operador, com custos variáveis associados aos volumes efetivos."
svc_docs_title = "Gestão documental"
svc_docs_text = "Documentos de transporte, DDT (documento de acompanhamento da mercadoria) e guias, rastreabilidade das mercadorias e integração com os sistemas de gestão do cliente."
svc_yards_title = "Parques descobertos"
