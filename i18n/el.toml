# --- Αρχική ---
home_title = "Consorzio Logistico Latina Scalo: αποθήκες και logistics για λογαριασμό τρίτων μεταξύ Latina και νότιας Ρώμης"
home_description = "Κέντρο logistics στο Latina Scalo (LT): 19.000 m² στεγασμένοι και 25.000 m² υπαίθριοι χώροι. Αποθήκευση, διακίνηση, μεταφορά και 3PL για επιχειρήσεις."
home_hero_title = "Αποθήκες και logistics για λογαριασμό τρίτων στο Latina Scalo"
home_hero_sub = "Η Consorzio Logistico Latina Scalo διαχειρίζεται στην Via della Dinamica, στην περιοχή Tor Tre Ponti, ένα κέντρο με 19.000 τετραγωνικά μέτρα στεγασμένων χώρων και 25.000 τετραγωνικά μέτρα υπαίθριων χώρων. Εξυπηρετεί επιχειρήσεις της επαρχίας Latina, των δήμων νότια της Ρώμης και των νότιων συνοικιών της πρωτεύουσας."
home_btn_services = "Υπηρεσίες"
home_btn_areas = "Περιοχές εξυπηρέτησης"
stat_members = "επιχειρήσεις-μέλη"
stat_covered = "τετραγωνικά μέτρα στεγασμένα"
stat_open = "τετραγωνικά μέτρα υπαίθρια"
stat_years = "έτη συνολικής εμπειρίας"
stat_eur = "km οδικώς από την EUR"
home_about_label = "Η Κοινοπραξία"
home_about_title = "Ποιοι είμαστε"
home_about_p1 = "Η Consorzio Logistico Latina Scalo συγκεντρώνει πέντε τοπικές επιχειρήσεις με συνολική εμπειρία άνω των πενήντα ετών στην αποθήκευση, τη διακίνηση και τη μεταφορά εμπορευμάτων."
home_about_p2 = "Το κέντρο βρίσκεται στη βιομηχανική ζώνη του Latina Scalo, 8 km από το κέντρο της Latina, 15 km από το Cisterna di Latina και 34 km από την Aprilia. Ο σιδηροδρομικός σταθμός της Latina, στη γραμμή Ρώμη–Formia–Νάπολη, βρίσκεται στο Latina Scalo· οι οδοί SS148 Pontina και SS7 Appia συνδέουν τις εγκαταστάσεις με τη Ρώμη και τη νότια περιοχή Pontino."
home_about_p3 = "Η Κοινοπραξία εργάζεται για λογαριασμό τρίτων: αποθήκευση σε ράφια και στο δάπεδο, προετοιμασία παραγγελιών, οδικές μεταφορές με αποκλειστικό στόλο και διαχείριση εγγράφων, με έναν μόνο συνομιλητή για τον εντολέα."
home_services_label = "Υπηρεσίες"
home_services_title = "Τι κάνει η Κοινοπραξία"
home_services_intro = "Υπηρεσίες logistics για λογαριασμό τρίτων για μεταποιητικές, εμπορικές επιχειρήσεις και επιχειρήσεις διανομής."
svc_storage_title = "Αποθήκευση και αποθήκες"
svc_storage_text = "Αρθρωτά κτίρια από 500 έως 3.000 τετραγωνικά μέτρα, ωφέλιμο ύψος έως 10 μέτρα, ράφια παλετών, χώροι ελεγχόμενης θερμοκρασίας και διαχείριση αποθεμάτων μέσω συστήματος WMS."
svc_transport_title = "Μεταφορά και διανομή"
svc_transport_text = "Οδικές μεταφορές με αποκλειστικό στόλο, παραδόσεις B2B σε όλη την Ιταλία και διανομή τελευταίου μιλίου στο Λάτσιο."
svc_handling_title = "Διακίνηση εμπορευμάτων"
svc_handling_text = "Παραλαβή, picking, packing, σήμανση, παλετοποίηση και cross-docking, με ποσοτικό και ποιοτικό έλεγχο κατά την είσοδο."
svc_3pl_title = "Logistics 3PL"
svc_3pl_text = "Αποθήκευση, διακίνηση και μεταφορά ανατίθενται σε έναν μόνο φορέα, με μεταβλητό κόστος που συνδέεται με τους πραγματικούς όγκους."
svc_docs_title = "Διαχείριση εγγράφων"
svc_docs_text = "Έγγραφα μεταφοράς, DDT (ιταλικά δελτία αποστολής) και φορτωτικές, ιχνηλασιμότητα των εμπορευμάτων και ενοποίηση με τα πληροφοριακά συστήματα του εντολέα."
svc_yards_title = "Υπαίθριοι χώροι"
svc_yards_text = "25.000 τετραγωνικά μέτρα υπαίθριων χώρων για δομικά υλικά, ογκώδη εμπορεύματα και οχήματα."
home_site_label = "Οι εγκαταστάσεις"
home_site_title = "Το κέντρο της Via della Dinamica"
home_site_intro = "Εξοπλισμός των εγκαταστάσεων logistics στη βιομηχανική ζώνη του Latina Scalo."
fac_buildings_title = "Κτίρια"
fac_buildings_text = "Αρθρωτές κατασκευές από 500 έως 3.000 τετραγωνικά μέτρα η καθεμία, ωφέλιμο ύψος έως 10 μέτρα, προετοιμασμένες για ράφια παλετών και συστήματα διακίνησης."
fac_yards_title = "Αύλειοι χώροι και ράμπες"
fac_yards_text = "Αύλειοι χώροι για ελιγμούς αρθρωτών φορτηγών, στεγασμένες ράμπες φόρτωσης και εκφόρτωσης και χώροι στάθμευσης οχημάτων."
fac_security_title = "Ασφάλεια"
fac_security_text = "Περιμετρική βιντεοεπιτήρηση, έλεγχος πρόσβασης, συστήματα πυρόσβεσης και συναγερμού· λειτουργία σε 24ωρη βάση."
fac_it_title = "Πληροφοριακά συστήματα"
fac_it_text = "Αποκλειστική σύνδεση οπτικών ινών, βιομηχανικό Wi-Fi και σύστημα WMS για τη διαχείριση της αποθήκης."
fac_offices_title = "Γραφεία"
