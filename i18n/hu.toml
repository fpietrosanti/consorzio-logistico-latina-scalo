home_title = "Consorzio Logistico Latina Scalo: raktárak és szerződéses logisztika Latina és Dél-Róma között"
home_description = "Logisztikai központ Latina Scalóban (LT): 19 000 m² fedett és 25 000 m² nyitott terület. Tárolás, handling, szállítás, 3PL Latina és Dél-Róma cégeinek."
home_hero_title = "Raktárak és szerződéses logisztika Latina Scalóban"
home_hero_sub = "A Consorzio Logistico Latina Scalo a Via della Dinamicán, Tor Tre Ponti övezetben 19 000 négyzetméter fedett és 25 000 négyzetméter nyitott területű logisztikai központot üzemeltet. Latina megye, a Rómától délre fekvő települések és a főváros déli negyedének vállalkozásait szolgálja ki."
