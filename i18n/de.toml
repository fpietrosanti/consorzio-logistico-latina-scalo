home_about_label = "Das Konsortium"
home_about_title = "Über uns"
home_about_p1 = "Im Consorzio Logistico Latina Scalo haben sich fünf Unternehmen aus der Region zusammengeschlossen, die zusammen über mehr als fünfzig Jahre Erfahrung in Lagerung, Umschlag und Transport von Waren verfügen."
home_about_p2 = "Der Standort liegt im Industriegebiet von Latina Scalo, 8 km vom Zentrum Latinas, 15 km von Cisterna di Latina und 34 km von Aprilia entfernt. Der Bahnhof Latina an der Strecke Rom–Formia–Neapel befindet sich in Latina Scalo; die SS148 Pontina und die SS7 Appia verbinden den Standort mit Rom und dem südlichen Pontino."
home_about_p3 = "Das Konsortium arbeitet als Kontraktlogistiker: Lagerung im Regal und am Boden, Kommissionierung, Straßentransport mit eigener Flotte und Dokumentenmanagement, mit einem einzigen Ansprechpartner für den Auftraggeber."
home_services_label = "Leistungen"
home_services_title = "Leistungen des Konsortiums"
home_services_intro = "Kontraktlogistik für Industrie-, Handels- und Distributionsunternehmen."
svc_storage_title = "Lagerung und Lagerhaltung"
svc_storage_text = "Modulare Hallen von 500 bis 3.000 Quadratmetern, nutzbare Höhe bis 10 Meter, Palettenregale, temperaturgeführte Bereiche und Bestandsführung im WMS."
svc_transport_title = "Transport und Distribution"
svc_transport_text = "Straßentransport mit eigener Flotte, B2B-Zustellungen im gesamten Inland und Distribution auf der letzten Meile im Latium."
svc_handling_title = "Warenumschlag"
svc_handling_text = "Wareneingang, Kommissionierung, Verpackung, Etikettierung, Palettierung und Cross-Docking, mit Mengen- und Qualitätskontrolle im Wareneingang."
svc_3pl_title = "3PL-Logistik"
svc_3pl_text = "Lagerung, Umschlag und Transport aus einer Hand, mit variablen Kosten nach tatsächlichem Volumen."
svc_docs_title = "Dokumentenmanagement"
svc_docs_text = "Transportdokumente, DDT (Lieferscheine), Sendungsverfolgung und Anbindung an die ERP-Systeme des Auftraggebers."
svc_yards_title = "Freiflächen"
svc_yards_text = "25.000 Quadratmeter Freifläche für Baumaterialien, sperrige Güter und Fahrzeuge."
home_site_label = "Der Standort"
home_site_title = "Der Standort in der Via della Dinamica"
home_site_intro = "Ausstattung des Logistikstandorts im Industriegebiet von Latina Scalo."
fac_buildings_title = "Hallen"
fac_buildings_text = "Modulare Hallen mit jeweils 500 bis 3.000 Quadratmetern, nutzbare Höhe bis 10 Meter, ausgelegt für Palettenregale und Fördertechnik."
fac_yards_title = "Freiflächen und Laderampen"
fac_yards_text = "Rangierflächen für Sattelzüge, überdachte Laderampen für Be- und Entladung sowie Abstellflächen für Fahrzeuge."
fac_security_title = "Sicherheit"
fac_security_text = "Videoüberwachung des Geländes, Zutrittskontrolle, Brandschutz- und Einbruchmeldeanlagen; Betrieb rund um die Uhr."
fac_it_title = "IT-Systeme"
fac_it_text = "Eigene Glasfaseranbindung, Industrie-WLAN und WMS für die Lagerverwaltung."
fac_offices_title = "Büros"
fac_offices_text = "Büros, Besprechungsräume und Pausenbereich für das operative Personal."
