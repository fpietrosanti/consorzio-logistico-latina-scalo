home_about_label = "Il-Konsorzju"
home_about_title = "Min aħna"
home_about_p1 = "Il-Consorzio Logistico Latina Scalo jiġbor flimkien ħames kumpaniji tal-inħawi, b'aktar minn ħamsin sena ta' esperjenza komplessiva fil-ħżin, fl-immaniġġjar u fit-trasport tal-merkanzija."
home_about_p2 = "Il-pol jinsab fiż-żona industrijali ta' Latina Scalo, 8 km miċ-ċentru ta' Latina, 15 km minn Cisterna di Latina u 34 km minn Aprilia. L-istazzjon ta' Latina, fuq il-linja Ruma–Formia–Napli, jinsab f'Latina Scalo; is-SS148 Pontina u s-SS7 Appia jgħaqqdu s-sit ma' Ruma u man-nofsinhar tar-reġjun Pontino."
home_about_p3 = "Il-Konsorzju jaħdem għal terzi: ħżin fuq xkafef u mal-art, preparazzjoni tal-ordnijiet, trasport bit-triq b'flotta dedikata u ġestjoni tad-dokumenti, b'interlokutur wieħed għall-klijent."
home_services_label = "Servizzi"
home_services_title = "X'jagħmel il-Konsorzju"
home_services_intro = "Servizzi ta' loġistika għal terzi għall-intrapriżi tal-manifattura, tal-kummerċ u tad-distribuzzjoni."
svc_storage_title = "Ħżin u maħżen"
svc_storage_text = "Binjiet modulari minn 500 sa 3,000 metru kwadru, għoli utli sa 10 metri, xkafef għall-pallets, żoni b'temperatura kkontrollata u inventarju ġestit permezz ta' sistema WMS."
svc_transport_title = "Trasport u distribuzzjoni"
svc_transport_text = "Trasport bit-triq b'flotta dedikata, kunsinni B2B fit-territorju nazzjonali Taljan u distribuzzjoni tal-aħħar mil fil-Lazio."
svc_handling_title = "Immaniġġjar tal-merkanzija"
svc_handling_text = "Riċeviment, picking, packing, tikkettar, palletizzazzjoni u cross-docking, b'kontroll tal-kwalità u tal-kwantità mad-dħul."
svc_3pl_title = "Loġistika 3PL"
svc_3pl_text = "Ħżin, immaniġġjar u trasport fdati f'operatur wieħed, bi spejjeż varjabbli marbuta mal-volumi effettivi."
svc_docs_title = "Ġestjoni tad-dokumenti"
svc_docs_text = "Dokumenti tat-trasport, DDT (nota tal-kunsinna) u bolol, traċċabilità tal-merkanzija u integrazzjoni mas-sistemi ġestjonali tal-klijent."
svc_yards_title = "Bitħat miftuħa"
svc_yards_text = "25,000 metru kwadru ta' żoni miftuħa għal materjali tal-kostruzzjoni, merkanzija voluminuża u vetturi."
home_site_label = "Is-sit"
home_site_title = "Il-pol ta' Via della Dinamica"
