home_about_label = "Le Consorzio"
home_about_title = "Qui sommes-nous"
home_about_p1 = "Le Consorzio Logistico Latina Scalo regroupe cinq entreprises locales, qui totalisent plus de cinquante ans d'expérience dans l'entreposage, la manutention et le transport de marchandises."
home_about_p2 = "La plateforme se trouve dans la zone industrielle de Latina Scalo, à 8 km du centre de Latina, à 15 km de Cisterna di Latina et à 34 km d'Aprilia. La gare de Latina, sur la ligne Rome–Formia–Naples, est située à Latina Scalo ; la SS148 Pontina et la SS7 Appia relient le site à Rome et au sud de la province."
home_about_p3 = "Le Consorzio travaille pour compte d'autrui : stockage en rayonnages et au sol, préparation de commandes, transport routier avec une flotte dédiée et gestion documentaire, avec un interlocuteur unique pour le donneur d'ordre."
home_services_label = "Services"
home_services_title = "Activités du Consorzio"
home_services_intro = "Services de logistique pour compte d'autrui destinés aux entreprises industrielles, commerciales et de la distribution."
svc_storage_title = "Stockage et entreposage"
svc_storage_text = "Bâtiments modulaires de 500 à 3 000 mètres carrés, hauteur utile jusqu'à 10 mètres, rayonnages à palettes, zones à température dirigée et inventaire géré par WMS."
svc_transport_title = "Transport et distribution"
svc_transport_text = "Transport routier avec flotte dédiée, livraisons B2B sur le territoire national et distribution du dernier kilomètre dans le Latium."
svc_handling_title = "Manutention des marchandises"
svc_handling_text = "Réception, picking, emballage, étiquetage, palettisation et cross-docking, avec contrôle qualitatif et quantitatif à l'entrée."
svc_3pl_title = "Logistique 3PL"
svc_3pl_text = "Stockage, manutention et transport confiés à un seul prestataire, avec des coûts variables liés aux volumes réels."
svc_docs_title = "Gestion documentaire"
svc_docs_text = "Documents de transport, DDT (document de transport italien) et bons de livraison, traçabilité des marchandises et intégration avec les systèmes de gestion du donneur d'ordre."
svc_yards_title = "Aires extérieures"
svc_yards_text = "25 000 mètres carrés de surfaces découvertes pour matériaux de construction, marchandises volumineuses et véhicules."
home_site_label = "Le site"
home_site_title = "La plateforme de la Via della Dinamica"
home_site_intro = "Équipements du site logistique dans la zone industrielle de Latina Scalo."
fac_buildings_title = "Bâtiments"
fac_buildings_text = "Structures modulaires de 500 à 3 000 mètres carrés chacune, hauteur utile jusqu'à 10 mètres, conçues pour accueillir des rayonnages à palettes et des systèmes de manutention."
fac_yards_title = "Cours et quais"
fac_yards_text = "Cours de manœuvre pour semi-remorques, quais de chargement et de déchargement couverts et aires de stationnement pour les véhicules."
fac_security_title = "Sécurité"
fac_security_text = "Vidéosurveillance périmétrique, contrôle d'accès, installations de protection incendie et anti-intrusion ; activité 24 heures sur 24."
