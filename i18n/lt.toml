# --- Pradžia ---
home_title = "Consorzio Logistico Latina Scalo: sandėliai ir trečiųjų šalių logistika tarp Latinos ir pietinės Romos dalies"
home_description = "Logistikos centras Latina Scalo (LT): 19 000 m² dengtų ir 25 000 m² atvirų plotų. Sandėliavimas, krova, transportas ir 3PL logistika Latinos ir pietų Romos įmonėms."
home_hero_title = "Sandėliai ir trečiųjų šalių logistika Latina Scalo"
home_hero_sub = "Consorzio Logistico Latina Scalo Via della Dinamica gatvėje, Tor Tre Ponti zonoje, valdo logistikos centrą, kuriame yra 19 000 kvadratinių metrų dengtų ir 25 000 kvadratinių metrų atvirų plotų. Jis aptarnauja Latinos provincijos, į pietus nuo Romos esančių savivaldybių ir pietinės sostinės dalies įmones."
home_btn_services = "Paslaugos"
home_btn_areas = "Aptarnaujamos teritorijos"
stat_members = "konsorciumo narės įmonės"
stat_covered = "kvadratinių metrų dengtų plotų"
stat_open = "kvadratinių metrų atvirų plotų"
stat_years = "metų bendros patirties"
stat_eur = "km keliais nuo EUR rajono"
home_about_label = "Konsorciumas"
home_about_title = "Apie mus"
home_about_p1 = "Consorzio Logistico Latina Scalo vienija penkias vietos įmones, kurių bendra sandėliavimo, krovinių krovos ir transporto patirtis viršija penkiasdešimt metų."
home_about_p2 = "Centras įsikūręs Latina Scalo pramoninėje zonoje, 8 km nuo Latinos centro, 15 km nuo Cisterna di Latina ir 34 km nuo Aprilia. Latinos geležinkelio stotis, esanti linijoje Roma–Formija–Neapolis, yra Latina Scalo; keliai SS148 Pontina ir SS7 Appia jungia objektą su Roma ir pietine Pontino lygumos dalimi."
home_about_p3 = "Konsorciumas dirba trečiųjų šalių užsakymu: sandėliavimas lentynose ir ant grindų, užsakymų komplektavimas, krovinių vežimas keliais nuosavu parku ir dokumentų valdymas, užsakovui bendraujant su vienu kontaktiniu asmeniu."
home_services_label = "Paslaugos"
home_services_title = "Ką daro Konsorciumas"
home_services_intro = "Trečiųjų šalių logistikos paslaugos gamybos, prekybos ir platinimo įmonėms."
svc_storage_title = "Sandėliavimas ir sandėlis"
svc_storage_text = "Moduliniai pastatai nuo 500 iki 3 000 kvadratinių metrų, naudingasis aukštis iki 10 metrų, padėklų lentynos, kontroliuojamos temperatūros zonos ir atsargų apskaita WMS sistemoje."
svc_transport_title = "Transportas ir paskirstymas"
svc_transport_text = "Krovinių vežimas keliais nuosavu parku, B2B pristatymai visoje Italijoje ir paskutinės mylios pristatymas Lacijaus regione."
svc_handling_title = "Krovinių krova"
svc_handling_text = "Priėmimas, komplektavimas, pakavimas, ženklinimas, krovimas ant padėklų ir cross-docking, su įvežamų prekių kokybės ir kiekio kontrole."
svc_3pl_title = "3PL logistika"
svc_3pl_text = "Sandėliavimas, krova ir transportas, patikėti vienam operatoriui, su kintamomis sąnaudomis pagal faktinius kiekius."
svc_docs_title = "Dokumentų valdymas"
svc_docs_text = "Transporto dokumentai, DDT ir važtaraščiai, prekių atsekamumas ir integracija su užsakovo valdymo sistemomis."
svc_yards_title = "Atviros aikštelės"
svc_yards_text = "25 000 kvadratinių metrų atvirų plotų statybinėms medžiagoms, didelių gabaritų kroviniams ir transporto priemonėms."
home_site_label = "Objektas"
home_site_title = "Centras Via della Dinamica gatvėje"
home_site_intro = "Logistikos objekto Latina Scalo pramoninėje zonoje įranga ir infrastruktūra."
fac_buildings_title = "Pastatai"
fac_buildings_text = "Moduliniai statiniai po 500–3 000 kvadratinių metrų, naudingasis aukštis iki 10 metrų, pritaikyti padėklų lentynoms ir krovos sistemoms."
fac_yards_title = "Aikštelės ir rampos"
fac_yards_text = "Aikštelės vilkikams su puspriekabėmis manevruoti, dengtos pakrovimo ir iškrovimo rampos bei transporto priemonių stovėjimo zonos."
fac_security_title = "Apsauga"
fac_security_text = "Perimetro vaizdo stebėjimas, įėjimo kontrolė, gaisro gesinimo ir apsaugos nuo įsilaužimo sistemos; veikla visą parą."
fac_it_title = "Informacinės sistemos"
fac_it_text = "Dedikuota šviesolaidinė linija, pramoninis Wi-Fi ir WMS sandėlio valdymo sistema."
fac_offices_title = "Biurai"
fac_offices_text = "Biurai, posėdžių salės ir poilsio zona operatyviniam personalui."
home_sectors_label = "Sektoriai"
home_sectors_title = "Aptarnaujami sektoriai"
home_sectors_intro = "Žemės ūkio ir maisto produktai, farmacija, automobilių pramonė, e. prekyba, statyba, tekstilė ir mada, didmeninė ir mažmeninė prekyba bei gamyba."
home_areas_label = "Teritorija"
home_areas_title = "Aptarnaujamos teritorijos"
home_areas_intro = "Atstumai keliais nuo objekto Via della Dinamica gatvėje, apskaičiuoti pagal OpenStreetMap kelių tinklą. Kiekviena savivaldybė ir rajonas turi atskirą puslapį su maršrutu, kelionės laiku ir paslaugomis."
