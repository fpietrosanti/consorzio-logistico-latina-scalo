home_title = "Consorzio Logistico Latina Scalo: skladišta i ugovorna logistika između Latine i južnog Rima"
home_description = "Logističko središte u mjestu Latina Scalo (LT): 19.000 m² natkrivenog i 25.000 m² otvorenog prostora. Skladištenje, manipulacija, prijevoz i 3PL logistika."
home_hero_title = "Skladišta i ugovorna logistika u mjestu Latina Scalo"
home_hero_sub = "Consorzio Logistico Latina Scalo upravlja u ulici Via della Dinamica, u zoni Tor Tre Ponti, središtem s 19.000 četvornih metara natkrivenog prostora i 25.000 četvornih metara otvorenih površina. Opslužuje tvrtke iz pokrajine Latina, općina južno od Rima i južnog dijela glavnoga grada."
