home_about_label = "Konzorcium"
home_about_title = "O nás"
home_about_p1 = "Consorzio Logistico Latina Scalo združuje päť miestnych firiem s viac ako päťdesiatimi rokmi celkových skúseností v skladovaní, manipulácii s tovarom a preprave."
home_about_p2 = "Areál sa nachádza v priemyselnej zóne Latina Scalo, 8 km od centra Latiny, 15 km od Cisterna di Latina a 34 km od Aprilie. Železničná stanica Latina na trati Rím – Formia – Neapol leží priamo v Latina Scalo; cesty SS148 Pontina a SS7 Appia spájajú areál s Rímom a s južnou časťou provincie."
home_about_p3 = "Konzorcium pracuje pre tretie strany: regálové a blokové skladovanie, kompletizácia objednávok, cestná preprava vlastnou flotilou a správa dokumentácie, pričom objednávateľ komunikuje s jedným partnerom."
home_services_label = "Služby"
home_services_title = "Čím sa Konzorcium zaoberá"
home_services_intro = "Služby zmluvnej logistiky pre výrobné, obchodné a distribučné firmy."
svc_storage_title = "Skladovanie a sklad"
svc_storage_text = "Modulárne haly s plochou od 500 do 3 000 metrov štvorcových, úžitková výška do 10 metrov, paletové regály, plochy s riadenou teplotou a evidencia zásob v systéme WMS."
svc_transport_title = "Preprava a distribúcia"
svc_transport_text = "Cestná preprava vlastnou flotilou, doručovanie B2B po celom Taliansku a distribúcia na poslednú míľu v regióne Lazio."
svc_handling_title = "Manipulácia s tovarom"
svc_handling_text = "Príjem, vychystávanie, balenie, etiketovanie, paletizácia a cross-docking s kvantitatívnou a kvalitatívnou kontrolou pri príjme."
svc_3pl_title = "Logistika 3PL"
svc_3pl_text = "Skladovanie, manipulácia a preprava zverené jednému operátorovi, s variabilnými nákladmi viazanými na skutočné objemy."
svc_docs_title = "Správa dokumentácie"
svc_docs_text = "Prepravné doklady, DDT (dodacie listy) a sprievodky, sledovateľnosť tovaru a prepojenie s informačnými systémami objednávateľa."
svc_yards_title = "Vonkajšie plochy"
svc_yards_text = "25 000 metrov štvorcových vonkajších plôch pre stavebné materiály, objemný tovar a vozidlá."
home_site_label = "Areál"
home_site_title = "Areál vo Via della Dinamica"
home_site_intro = "Vybavenie logistického areálu v priemyselnej zóne Latina Scalo."
fac_buildings_title = "Haly"
fac_buildings_text = "Modulárne objekty s plochou od 500 do 3 000 metrov štvorcových, úžitková výška do 10 metrov, pripravené na paletové regály a manipulačné systémy."
fac_yards_title = "Manipulačné plochy a rampy"
fac_yards_text = "Plochy na manévrovanie návesových súprav, kryté nakladacie a vykladacie rampy a parkovacie plochy pre vozidlá."
fac_security_title = "Bezpečnosť"
fac_security_text = "Kamerový dohľad po obvode, kontrola vstupu, protipožiarne a zabezpečovacie systémy; prevádzka 24 hodín denne."
fac_it_title = "Informačné systémy"
fac_it_text = "Vyhradené optické pripojenie, priemyselná Wi-Fi a systém WMS na riadenie skladu."
fac_offices_title = "Kancelárie"
fac_offices_text = "Kancelárie, zasadacie miestnosti a priestor na občerstvenie pre prevádzkový personál."
home_sectors_label = "Odvetvia"
home_sectors_title = "Obsluhované odvetvia"
home_sectors_intro = "Agropotravinárstvo, farmácia, automobilový priemysel, e-commerce, stavebníctvo, textil a móda, veľkoobchodná distribúcia a výroba."
home_areas_label = "Územie"
home_areas_title = "Obsluhované oblasti"
home_areas_intro = "Cestné vzdialenosti od areálu vo Via della Dinamica, vypočítané na sieti OpenStreetMap. Každá obec a mestská štvrť má vlastnú stránku s trasou, časmi a službami."
