# --- Domov ---
home_title = "Consorzio Logistico Latina Scalo: sklady a zmluvná logistika medzi Latinou a južným Rímom"
home_description = "Logistický areál v Latina Scalo (LT): 19 000 m² krytých a 25 000 m² vonkajších plôch. Skladovanie, manipulácia, preprava a logistika 3PL pre firmy z Latiny a južného Ríma."
home_hero_title = "Sklady a zmluvná logistika v Latina Scalo"
home_hero_sub = "Consorzio Logistico Latina Scalo prevádzkuje vo Via della Dinamica, v zóne Tor Tre Ponti, areál s 19 000 metrami štvorcovými krytých plôch a 25 000 metrami štvorcovými vonkajších plôch. Obsluhuje firmy z provincie Latina, z obcí južne od Ríma a z južnej časti hlavného mesta."
home_btn_services = "Služby"
home_btn_areas = "Obsluhované oblasti"
stat_members = "členských firiem"
