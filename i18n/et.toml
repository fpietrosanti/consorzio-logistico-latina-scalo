home_title = "Consorzio Logistico Latina Scalo: laod ja lepinguline logistika Latina ja Lõuna-Rooma vahel"
home_description = "Logistikakeskus Latina Scalos (LT): 19 000 m² katusealust ja 25 000 m² välipinda. Ladustamine, käitlus, vedu ja 3PL-logistika Latina ja Lõuna-Rooma ettevõtetele."
home_hero_title = "Laod ja lepinguline logistika Latina Scalos"
home_hero_sub = "Consorzio Logistico Latina Scalo haldab Via della Dinamical Tor Tre Ponti piirkonnas keskust, millel on 19 000 ruutmeetrit katusealust pinda ja 25 000 ruutmeetrit välipinda. Konsortsium teenindab Latina provintsi, Roomast lõuna pool asuvate omavalitsuste ja pealinna lõunaosa ettevõtteid."
