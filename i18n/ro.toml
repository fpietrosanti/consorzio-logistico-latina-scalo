home_about_label = "Consorțiul"
home_about_title = "Cine suntem"
home_about_p1 = "Consorzio Logistico Latina Scalo reunește cinci companii din zonă, cu peste cincizeci de ani de experiență cumulată în depozitarea, manipularea și transportul mărfurilor."
home_about_p2 = "Platforma se află în zona industrială Latina Scalo, la 8 km de centrul orașului Latina, la 15 km de Cisterna di Latina și la 34 km de Aprilia. Gara Latina, pe linia Roma–Formia–Napoli, se află la Latina Scalo; drumurile SS148 Pontina și SS7 Appia leagă amplasamentul de Roma și de sudul regiunii pontine."
home_about_p3 = "Consorțiul lucrează în regim de logistică pentru terți: depozitare pe rafturi și la sol, pregătirea comenzilor, transport rutier cu flotă dedicată și gestiunea documentelor, cu un singur interlocutor pentru client."
home_services_label = "Servicii"
home_services_title = "Ce face Consorțiul"
home_services_intro = "Servicii de logistică pentru terți destinate companiilor din industria prelucrătoare, comerț și distribuție."
svc_storage_title = "Depozitare și antrepozit"
svc_storage_text = "Hale modulare de la 500 la 3.000 de metri pătrați, înălțime utilă de până la 10 metri, rafturi pentru paleți, zone cu temperatură controlată și inventar gestionat prin sistem WMS."
svc_transport_title = "Transport și distribuție"
svc_transport_text = "Transport rutier cu flotă dedicată, livrări B2B pe teritoriul Italiei și distribuție pe ultimul kilometru în regiunea Lazio."
svc_handling_title = "Manipularea mărfurilor"
svc_handling_text = "Recepție, picking, ambalare, etichetare, paletizare și cross-docking, cu control cantitativ și calitativ la intrare."
svc_3pl_title = "Logistică 3PL"
svc_3pl_text = "Depozitare, manipulare și transport încredințate unui singur operator, cu costuri variabile legate de volumele efective."
svc_docs_title = "Gestiunea documentelor"
svc_docs_text = "Documente de transport, DDT (aviz de însoțire a mărfii) și borderouri, trasabilitatea mărfurilor și integrarea cu sistemele de gestiune ale clientului."
svc_yards_title = "Platforme descoperite"
svc_yards_text = "25.000 de metri pătrați de suprafețe descoperite pentru materiale de construcții, mărfuri voluminoase și vehicule."
home_site_label = "Amplasamentul"
home_site_title = "Platforma din Via della Dinamica"
home_site_intro = "Dotările amplasamentului logistic din zona industrială Latina Scalo."
fac_buildings_title = "Hale"
fac_buildings_text = "Structuri modulare de la 500 la 3.000 de metri pătrați fiecare, înălțime utilă de până la 10 metri, pregătite pentru rafturi de paleți și sisteme de manipulare."
fac_yards_title = "Platforme și rampe"
fac_yards_text = "Platforme pentru manevra autoarticulatelor, rampe de încărcare și descărcare acoperite și zone de staționare pentru vehicule."
fac_security_title = "Securitate"
fac_security_text = "Supraveghere video perimetrală, control acces, instalații de stingere a incendiilor și antiefracție; activitate 24 de ore din 24."
fac_it_title = "Sisteme informatice"
fac_it_text = "Fibră optică dedicată, Wi-Fi industrial și sistem WMS pentru gestiunea depozitului."
fac_offices_title = "Birouri"
fac_offices_text = "Birouri, săli de ședință și spațiu de pauză pentru personalul operativ."
