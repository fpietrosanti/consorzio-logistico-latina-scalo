home_hero_title = "Warehousing and third-party logistics in Latina Scalo"
home_hero_sub = "Consorzio Logistico Latina Scalo operates a site in Via della Dinamica, in the Tor Tre Ponti area, with 19,000 square metres of covered space and 25,000 square metres of open yards. It serves companies in the province of Latina, in the municipalities south of Rome and in the southern districts of the capital."
