# --- Baile ---
home_title = "Consorzio Logistico Latina Scalo: stórais agus lóistíocht tríú páirtí idir Latina agus deisceart na Róimhe"
home_description = "Láthair lóistíochta in Latina Scalo (LT): 19,000 m² faoi dhíon agus 25,000 m² amuigh. Stóráil, láimhseáil, iompar agus 3PL do ghnólachtaí Latina agus dheisceart na Róimhe."
home_hero_title = "Stórais agus lóistíocht tríú páirtí in Latina Scalo"
home_hero_sub = "Oibríonn Consorzio Logistico Latina Scalo láthair ar Via della Dinamica, i gceantar Tor Tre Ponti, le 19,000 méadar cearnach de spás faoi dhíon agus 25,000 méadar cearnach de chlóis amuigh. Freastalaíonn sé ar ghnólachtaí i gcúige Latina, sna bardais ó dheas den Róimh agus i gceantair dheisceart na príomhchathrach."
home_btn_services = "Seirbhísí"
home_btn_areas = "Limistéir a bhfreastalaítear orthu"
stat_members = "comhlacht ball"
stat_covered = "méadar cearnach faoi dhíon"
stat_open = "méadar cearnach amuigh"
stat_years = "bliain de thaithí chomhcheangailte"
stat_eur = "km de bhóthar ó EUR"
home_about_label = "An Cuibhreannas"
home_about_title = "Fúinn"
home_about_p1 = "Tugann Consorzio Logistico Latina Scalo cúig chomhlacht áitiúla le chéile a bhfuil níos mó ná caoga bliain de thaithí chomhcheangailte acu i stórasú, i láimhseáil agus in iompar lasta."
home_about_p2 = "Tá an láthair i limistéar tionsclaíoch Latina Scalo, 8 km ó lár bhaile Latina, 15 km ó Cisterna di Latina agus 34 km ó Aprilia. Tá stáisiún iarnróid Latina, ar líne na Róimhe–Formia–Napoli, in Latina Scalo; nascann bóithre SS148 Pontina agus SS7 Appia an láthair leis an Róimh agus le deisceart an cheantair Phontínigh."
home_about_p3 = "Oibríonn an Cuibhreannas ar bhonn tríú páirtí: stóráil ar raicíní agus ar an urlár, piocadh orduithe, iompar de bhóthar le flít thiomnaithe agus bainistíocht doiciméad, le pointe teagmhála amháin don chliant."
home_services_label = "Seirbhísí"
home_services_title = "Obair an Chuibhreannais"
home_services_intro = "Seirbhísí lóistíochta tríú páirtí do chomhlachtaí déantúsaíochta, trádála agus dáileacháin."
svc_storage_title = "Stóráil agus stórasú"
svc_storage_text = "Foirgnimh mhodúlacha idir 500 agus 3,000 méadar cearnach, airde shaor suas le 10 méadar, raicíní pailléad, limistéir faoi rialú teochta agus fardal á bhainistiú trí WMS (córas bainistíochta stórais)."
svc_transport_title = "Iompar agus dáileadh"
svc_transport_text = "Iompar de bhóthar le flít thiomnaithe, seachadtaí B2B ar fud na hIodáile agus dáileadh an mhíle dheireanaigh (last mile) i Lazio."
svc_handling_title = "Láimhseáil earraí"
svc_handling_text = "Glacadh earraí, piocadh, pacáil, lipéadú, pailléadú agus tras-dugáil (cross-docking), le seiceálacha cainníochta agus cáilíochta ar theacht isteach."
svc_3pl_title = "Lóistíocht 3PL"
svc_3pl_text = "Stóráil, láimhseáil agus iompar curtha de chúram ar oibreoir amháin, le costais athraitheacha atá nasctha leis na méideanna iarbhír."
svc_docs_title = "Bainistíocht doiciméad"
svc_docs_text = "Doiciméid iompair, DDT (nótaí seachadta Iodálacha) agus nótaí coinsínithe, inrianaitheacht earraí agus comhtháthú le córais bhainistíochta an chliaint."
svc_yards_title = "Clóis amuigh"
svc_yards_text = "25,000 méadar cearnach de spás amuigh d'ábhair thógála, d'earraí toirtiúla agus d'fheithiclí."
home_site_label = "An láthair"
home_site_title = "Láthair Via della Dinamica"
home_site_intro = "Saoráidí na láithreach lóistíochta i limistéar tionsclaíoch Latina Scalo."
fac_buildings_title = "Foirgnimh"
fac_buildings_text = "Foirgnimh mhodúlacha idir 500 agus 3,000 méadar cearnach an ceann, airde shaor suas le 10 méadar, ullmhaithe do raicíní pailléad agus do chórais láimhseála."
fac_yards_title = "Clóis agus bánna"
fac_yards_text = "Clóis le haghaidh ainlithe leoraithe altacha, bánna lódála agus díluchtaithe faoi dhíon agus limistéir pháirceála feithiclí."
fac_security_title = "Slándáil"
fac_security_text = "TCI imlíne, rialú rochtana, córais chosanta dóiteáin agus aláraim foghlaithe; oibríochtaí 24 uair an chloig sa lá."
fac_it_title = "Córais TF"
fac_it_text = "Nasc snáthoptaice tiomnaithe, Wi-Fi tionsclaíoch agus WMS chun an stóras a bhainistiú."
fac_offices_title = "Oifigí"
fac_offices_text = "Oifigí, seomraí cruinnithe agus limistéar sosa don fhoireann oibríochta."
home_sectors_label = "Earnálacha"
home_sectors_title = "Earnálacha a bhfreastalaítear orthu"
home_sectors_intro = "Agraibhia, cógaisíocht, mótarthionscal, ríomhthráchtáil, tógáil, teicstílí agus faisean, miondíol ar mhórscála agus déantúsaíocht."
home_areas_label = "Críoch"
home_areas_title = "Limistéir a bhfreastalaítear orthu"
home_areas_intro = "Faid de bhóthar ó láthair Via della Dinamica, ríofa ar líonra OpenStreetMap. Tá leathanach ag gach bardas agus gach ceantar ina dtugtar an bealach, na hamanna taistil agus na seirbhísí."
