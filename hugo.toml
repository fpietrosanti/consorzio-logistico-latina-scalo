baseURL = 'https://consorziologistico.it/'
title = 'Consorzio Logistico Latina Scalo'
theme = 'clls'
enableRobotsTXT = true
enableGitInfo = true
disableKinds = ['taxonomy', 'term', 'rss']
defaultContentLanguage = 'it'
defaultContentLanguageInSubdir = false
refLinksErrorLevel = 'WARNING'
refLinksNotFoundURL = '#'

[outputFormats]
  [outputFormats.llms]
    mediaType = "text/plain"
    baseName = "llms"
    isPlainText = true
    notAlternative = true

[outputs]
  home = ["html", "llms"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[sitemap]
  changefreq = 'monthly'
  priority = 0.5

[params]
  email = "info@consorziologistico.it"
  telefono = "+39 0773 316008"
  telefonoE164 = "+390773316008"
  whatsapp = "390773316008"
  pec = "consorziologisticolatinascalo@pec.it"
  via = "Via della Dinamica snc"
  localita = "Zona Tor Tre Ponti, Latina Scalo"
  cap = "04100"
  citta = "Latina"
  provincia = "LT"
  lat = 41.510060381449215
  lon = 12.950756550932178
  linkedin = "https://www.linkedin.com/company/consorzio-logistico-latina-scalo/"
  googleMapsEmbed = "https://www.google.com/maps/embed?pb=!1m17!1m12!1m3!1d1500!2d12.950756550932178!3d41.510060381449215!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m2!1m1!1s0x0%3A0x0!5e0!3m2!1sit!2sit!4v1700000000000!5m2!1sit!2sit"

