home_title = "Consorzio Logistico Latina Scalo: armazéns e logística por conta de terceiros entre Latina e o sul de Roma"
home_description = "Polo logístico em Latina Scalo (LT): 19 000 m² cobertos e 25 000 m² descobertos. Armazenagem, movimentação, transporte e logística 3PL para empresas de Latina e do sul de Roma."
home_hero_title = "Armazéns e logística por conta de terceiros em Latina Scalo"
home_hero_sub = "O Consorzio Logistico Latina Scalo gere, na Via della Dinamica, zona de Tor Tre Ponti, um polo com 19 000 metros quadrados cobertos e 25 000 metros quadrados de áreas descobertas. Serve as empresas da província de Latina, dos municípios a sul de Roma e do quadrante sul da capital."
