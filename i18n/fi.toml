home_title = "Consorzio Logistico Latina Scalo: varastot ja kolmannen osapuolen logistiikka Latinan ja Etelä-Rooman välillä"
home_description = "Logistiikkakeskus Latina Scalossa (LT): 19 000 m² katettua ja 25 000 m² ulkoaluetta. Varastointi, käsittely, kuljetus ja 3PL-logistiikka Latinan ja Etelä-Rooman yrityksille."
home_hero_title = "Varastot ja kolmannen osapuolen logistiikka Latina Scalossa"
home_hero_sub = "Consorzio Logistico Latina Scalo ylläpitää Via della Dinamicalla Tor Tre Pontin alueella logistiikkakeskusta, jossa on 19 000 neliömetriä katettua tilaa ja 25 000 neliömetriä ulkoalueita. Asiakkaina ovat Latinan maakunnan, Rooman eteläpuolisten kuntien ja pääkaupungin eteläisten kaupunginosien yritykset."
home_btn_services = "Palvelut"
home_btn_areas = "Palvelualueet"
