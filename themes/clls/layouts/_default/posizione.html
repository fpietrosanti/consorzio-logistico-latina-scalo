{{ define "main" }}
<section class="section visible" style="padding-top: 6rem;">
  <div class="container">
    <span class="section-label">Location</span>
    <h1>{{ .Title }}</h1>
    {{ with .Description }}<p class="section-intro">{{ . }}</p>{{ end }}
    <div class="service-page-content">
      {{ .Content }}
    </div>
  </div>
</section>
{{ end }}
