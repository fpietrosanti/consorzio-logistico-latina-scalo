home_title = "Consorzio Logistico Latina Scalo: lagre og tredjepartslogistik mellem Latina og det sydlige Rom"
home_description = "Logistikcenter i Latina Scalo (LT): 19.000 m² overdækket og 25.000 m² udendørs. Lagring, håndtering, transport og 3PL for virksomheder i Latina og det sydlige Rom."
home_hero_title = "Lagre og tredjepartslogistik i Latina Scalo"
home_hero_sub = "Consorzio Logistico Latina Scalo driver i Via della Dinamica, området Tor Tre Ponti, et logistikcenter med 19.000 kvadratmeter overdækket areal og 25.000 kvadratmeter udendørs arealer. Konsortiet betjener virksomheder i provinsen Latina, i kommunerne syd for Rom og i den sydlige del af hovedstaden."
