home_title = "Consorzio Logistico Latina Scalo: складове и логистика за трети лица между Латина и Южен Рим"
home_description = "Логистичен център в Latina Scalo (LT): 19 000 м² закрити и 25 000 м² открити площи. Складиране, обработка, транспорт и 3PL за фирми от Латина и Южен Рим."
home_hero_title = "Складове и логистика за трети лица в Latina Scalo"
home_hero_sub = "Consorzio Logistico Latina Scalo управлява на Via della Dinamica, в зона Tor Tre Ponti, център с 19 000 квадратни метра закрити и 25 000 квадратни метра открити площи. Обслужва фирми от провинция Латина, от общините южно от Рим и от южния сектор на столицата."
