home_about_label = "Il Consorzio"
home_about_title = "Chi siamo"
home_about_p1 = "Il Consorzio Logistico Latina Scalo riunisce cinque aziende del territorio, con oltre cinquant'anni di esperienza complessiva nel magazzinaggio, nella movimentazione e nel trasporto delle merci."
home_about_p2 = "Il polo si trova nell'area industriale di Latina Scalo, a 8 km dal centro di Latina, a 15 km da Cisterna di Latina e a 34 km da Aprilia. La stazione di Latina, sulla linea Roma–Formia–Napoli, è a Latina Scalo; la SS148 Pontina e la SS7 Appia collegano il sito con Roma e con il sud pontino."
home_about_p3 = "Il Consorzio lavora per conto terzi: stoccaggio a scaffale e a terra, preparazione degli ordini, trasporto su gomma con flotta dedicata e gestione documentale, con un unico interlocutore per il committente."
home_services_label = "Servizi"
home_services_title = "Cosa fa il Consorzio"
home_services_intro = "Servizi di logistica conto terzi per imprese manifatturiere, commerciali e della distribuzione."
svc_storage_title = "Stoccaggio e magazzino"
svc_storage_text = "Capannoni modulari da 500 a 3.000 metri quadrati, altezza utile fino a 10 metri, scaffalature portapallet, aree a temperatura controllata e inventario gestito a sistema WMS."
svc_transport_title = "Trasporto e distribuzione"
svc_transport_text = "Trasporto su gomma con flotta dedicata, consegne B2B sul territorio nazionale e distribuzione dell'ultimo miglio nel Lazio."
svc_handling_title = "Movimentazione merci"
svc_handling_text = "Ricevimento, picking, packing, etichettatura, pallettizzazione e cross-docking, con controllo quali-quantitativo in ingresso."
svc_3pl_title = "Logistica 3PL"
svc_3pl_text = "Stoccaggio, movimentazione e trasporto affidati a un solo operatore, con costi variabili legati ai volumi effettivi."
svc_docs_title = "Gestione documentale"
svc_docs_text = "Documenti di trasporto, DDT e bolle, tracciabilità delle merci e integrazione con i sistemi gestionali del committente."
svc_yards_title = "Piazzali scoperti"
svc_yards_text = "25.000 metri quadrati di aree scoperte per materiali da costruzione, merci voluminose e mezzi."
home_site_label = "Il sito"
home_site_title = "Il polo di Via della Dinamica"
home_site_intro = "Dotazioni del sito logistico nell'area industriale di Latina Scalo."
fac_buildings_title = "Capannoni"
fac_buildings_text = "Strutture modulari da 500 a 3.000 metri quadrati ciascuna, altezza utile fino a 10 metri, predisposte per scaffalature portapallet e sistemi di movimentazione."
fac_yards_title = "Piazzali e baie"
fac_yards_text = "Piazzali per la manovra di autoarticolati, baie di carico e scarico coperte e aree di sosta per i veicoli."
fac_security_title = "Sicurezza"
fac_security_text = "Videosorveglianza perimetrale, controllo accessi, impianti antincendio e antintrusione; operatività 24 ore su 24."
fac_it_title = "Sistemi informativi"
fac_it_text = "Fibra ottica dedicata, Wi-Fi industriale e sistema WMS per la gestione del magazzino."
fac_offices_title = "Uffici"
fac_offices_text = "Uffici, sale riunioni e area ristoro per il personale operativo."
