home_title = "Consorzio Logistico Latina Scalo: magazzini e logistica conto terzi tra Latina e Roma Sud"
home_description = "Polo logistico a Latina Scalo (LT): 19.000 m² coperti e 25.000 m² scoperti. Stoccaggio, handling, trasporto e logistica 3PL per imprese di Latina e Roma Sud."
home_hero_title = "Magazzini e logistica conto terzi a Latina Scalo"
home_hero_sub = "Il Consorzio Logistico Latina Scalo gestisce in Via della Dinamica, zona Tor Tre Ponti, un polo con 19.000 metri quadrati coperti e 25.000 metri quadrati di aree scoperte. Serve le imprese della provincia di Latina, dei comuni a sud di Roma e del quadrante sud della Capitale."
