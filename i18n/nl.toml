home_about_p1 = "Het Consorzio Logistico Latina Scalo bundelt vijf bedrijven uit de regio, met samen ruim vijftig jaar ervaring in warehousing, goederenbehandeling en goederenvervoer."
home_about_p2 = "Het logistiek centrum ligt op het industrieterrein van Latina Scalo, op 8 km van het centrum van Latina, 15 km van Cisterna di Latina en 34 km van Aprilia. Het station van Latina, aan de lijn Rome–Formia–Napels, ligt in Latina Scalo; de SS148 Pontina en de SS7 Appia verbinden de locatie met Rome en met het zuiden van de provincie."
home_about_p3 = "Het Consorzio werkt voor derden: opslag in stellingen en blokstapeling, orderpicking, wegtransport met een eigen wagenpark en documentbeheer, met één aanspreekpunt voor de opdrachtgever."
