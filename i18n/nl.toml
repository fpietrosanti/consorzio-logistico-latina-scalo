home_title = "Consorzio Logistico Latina Scalo: warehousing en contractlogistiek tussen Latina en Zuid-Rome"
home_description = "Logistiek centrum in Latina Scalo (LT): 19.000 m² overdekt en 25.000 m² buitenterrein. Opslag, handling, transport en 3PL voor bedrijven in Latina en Zuid-Rome."
home_hero_title = "Warehousing en contractlogistiek in Latina Scalo"
home_hero_sub = "Het Consorzio Logistico Latina Scalo exploiteert aan de Via della Dinamica, in de zone Tor Tre Ponti, een logistiek centrum met 19.000 vierkante meter overdekte ruimte en 25.000 vierkante meter buitenterrein. Het bedient bedrijven in de provincie Latina, in de gemeenten ten zuiden van Rome en in de zuidelijke stadsdelen van de hoofdstad."
