home_title = "Consorzio Logistico Latina Scalo: magazyny i logistyka kontraktowa między Latiną a południowym Rzymem"
home_description = "Centrum logistyczne w Latina Scalo (LT): 19 000 m² krytych i 25 000 m² otwartych. Składowanie, handling, transport i logistyka 3PL dla firm z Latiny i Rzymu."
home_hero_title = "Magazyny i logistyka kontraktowa w Latina Scalo"
home_hero_sub = "Consorzio Logistico Latina Scalo prowadzi przy Via della Dinamica, w strefie Tor Tre Ponti, centrum logistyczne o powierzchni 19 000 metrów kwadratowych krytych i 25 000 metrów kwadratowych placów otwartych. Obsługuje firmy z prowincji Latina, z gmin położonych na południe od Rzymu oraz z południowej części stolicy."
home_btn_services = "Usługi"
home_btn_areas = "Obsługiwane obszary"
